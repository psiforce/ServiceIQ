# Local ServiceIQ stack: Postgres + API + customer chat + admin console.
#   docker compose up --build        then open http://localhost:8501 (chat) and http://localhost:8502 (admin)
# API keys come from your .env file. Demo logins and widget keys are written to ./var/docker/.

x-serviceiq: &serviceiq
  build: .
  image: serviceiq:local
  env_file: .env
  environment:
    DATABASE_URL: postgresql+psycopg://serviceiq:serviceiq-local@db:5432/serviceiq
    OUTBOX_DIR: /app/var/outbox
  volumes:
    - ./var/docker:/app/var

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: serviceiq
      POSTGRES_USER: serviceiq
      POSTGRES_PASSWORD: serviceiq-local
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U serviceiq -d serviceiq"]
      interval: 3s
      retries: 20

  init:  # one-off: create tables, provision tenants, seed the document registry, create demo admins
    <<: *serviceiq
    command: ["init-db"]
    depends_on:
      db: {condition: service_healthy}

  api:
    <<: *serviceiq
    command: ["api"]
    ports: ["8000:8080"]
    depends_on:
      init: {condition: service_completed_successfully}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/health')"]
      interval: 5s
      retries: 20

  chat:
    <<: *serviceiq
    command: ["chat"]
    ports: ["8501:8080"]
    environment:
      DATABASE_URL: postgresql+psycopg://serviceiq:serviceiq-local@db:5432/serviceiq
      CHAT_API_URL: http://api:8080
    depends_on:
      api: {condition: service_healthy}

  admin:
    <<: *serviceiq
    command: ["admin"]
    ports: ["8502:8080"]
    depends_on:
      init: {condition: service_completed_successfully}

volumes:
  pgdata:
