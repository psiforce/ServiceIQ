e="13" font-weight="400" fill="#4A2C00" text-anchor="middle" dominant-baseline="central"><tspan x="117.5" dy="0">(HTML / CSV)</tspan></text><rect x="25" y="362" width="185" height="96" rx="8" fill="#E8F0FB" stroke="#2F5B9A" stroke-width="1.6"/><text x="117.5" y="384.6875" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700" fill="#14284B" text-anchor="middle" dominant-baseline="central"><tspan x="117.5" dy="0">Triggers</tspan></text><text x="117.5" y="402.1875" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="400" fill="#14284B" text-anchor="middle" dominant-baseline="central"><tspan x="117.5" dy="0">document.approved ·</tspan><tspan x="117.5" dy="16.25">schedule · expiry ·</tspan><tspan x="117.5" dy="16.25">manual reindex</tspan></text><rect x="250" y="110" width="200" height="120" rx="8" fill="#E7F6EE" stroke="#2E8B57" stroke-width="1.6"/><text x="350" y="144.6875" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700" fill="#123D27" text-anchor="middle" dominant-baseline="central"><tspan x="350" dy="0">1  Load</tspan></text><text x="350" y="162.1875" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="400" fill="#123D27" text-anchor="middle" dominant-baseline="central"><tspan x="350" dy="0">LangChain loaders:</tspan><tspan x="350" dy="16.25">web, PDF, DOCX, CSV;</tspan><tspan x="350" dy="16.25">fetch raw from storage</tspan></text><rect x="475" y="110" width="200" height="120" rx="8" fill="#E7F6EE" stroke="#2E8B57" stroke-width="1.6"/><text x="575" y="144.6875" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700" fill="#123D27" text-anchor="middle" dominant-baseline="central"><tspan x="575" dy="0">2  Clean</tspan></text><text x="575" y="162.1875" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="400" fill="#123D27" text-anchor="middle" dominant-baseline="central"><tspan x="575" dy="0">strip nav &amp; boilerplate;</tspan><tspan x="575" dy="16.25">dedupe (content hash);</tspan><tspan x="575" dy="16.25">keep headings &amp; tables</tspan></text><rect x="700" y="110" width="200" height="120" rx="8" fill="#E7F6EE" stroke="#2E8B57" stroke-width="1.6"/><text x="800" y="144.6875" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700" fill="#123D27" text-anchor="middle" dominant-baseline="central"><tspan x="800" dy="0">3  Enrich metadata</tspan></text><text x="800" y="162.1875" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="400" fill="#123D27" text-anchor="middle" dominant-baseline="central"><tspan x="800" dy="0">tenant, doc, type, version,</tspan><tspan x="800" dy="16.25">effective / expiry,</tspan><tspan x="800" dy="16.25">approval, access_scope</tspan></text><rect x="925" y="110" width="200" height="120" rx="8" fill="#E7F6EE" stroke="#2E8B57" stroke-width="1.6"/><text x="1025" y="144.6875" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700" fill="#123D27" text-anchor="middle" dominant-baseline="central"><tspan x="1025" dy="0">4  Chunk</tspan></text><text x="1025" y="162.1875" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="400" fill="#123D27" text-anchor="middle" dominant-baseline="central"><tspan x="1025" dy="0">structure-aware ~500 tok,</tspan><tspan x="1025" dy="16.25">75 overlap; whole FAQs</tspan><tspan x="1025" dy="16.25">&amp; policy clauses</tspan></text><rect x="250" y="330" width="200" height="120" rx="8" fill="#E7F6EE" stroke="#2E8B57" stroke-width="1.6"/><text x="350" y="364.6875" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700" fill="#123D27" text-anchor="middle" dominant-baseline="central"><tspan x="350" dy="0">5  Embed</tspan></text><text x="350" y="382.1875" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="400" fill="#123D27" text-anchor="middle" dominant-baseline="central"><tspan x="350" dy="0">text-embedding-3-small;</tspan><tspan x="350" dy="16.25">batched, retried,</tspan><tspan x="350" dy="16.25">cost metered</tspan></text><rect x="475" y="330" width="200" height="120" rx="8" fill="#E7F6EE" stroke="#2E8B57" stroke-width="1.6"/><text x="575" y="373.125" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700" fill="#123D27" text-anchor="middle" dominant-baseline="central"><tspan x="575" dy="0">6  Upsert</tspan></text><text x="575" y="390.3125" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="400" fill="#123D27" text-anchor="middle" dominant-baseline="central"><tspan x="575" dy="0">namespace = tenant;</tspan><tspan x="575" dy="16.25">id = doc:version:chunk</tspan></text><rect x="700" y="330" width="200" height="120" rx="8" fill="#E7F6EE" stroke="#2E8B57" stroke-width="1.6"/><text x="800" y="364.6875" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700" fill="#123D27" text-anchor="middle" dominant-baseline="central"><tspan x="800" dy="0">7  Activate &amp; retire</tspan></text><text x="800" y="382.1875" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="400" fill="#123D27" text-anchor="middle" dominant-baseline="central"><tspan x="800" dy="0">switch current version;</tspan><tspan x="800" dy="16.25">delete superseded</tspan><tspan x="800" dy="16.25">vectors</tspan></text><rect x="925" y="330" width="200" height="120" rx="8" fill="#E7F6EE" stroke="#2E8B57" stroke-width="1.6"/><text x="1025" y="364.6875" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700" fill="#123D27" text-anchor="middle" dominant-baseline="central"><tspan x="1025" dy="0">8  Validate</tspan></text><text x="1025" y="382.1875" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="400" fill="#123D27" text-anchor="middle" dominant-baseline="central"><tspan x="1025" dy="0">chunk counts; smoke</tspan><tspan x="1025" dy="16.25">retrieval test;</tspan><tspan x="1025" dy="16.25">SLA timer stop</tspan></text><rect x="250" y="540" width="200" height=