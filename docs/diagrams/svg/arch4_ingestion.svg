dominant-baseline="central" font-style="italic"><tspan x="575" dy="0">Freshness SLA: pricing / policy / warranty ≤ 15 min after approval · general knowledge ≤ 24 h · new version is activated only after all its vectors are upserted (no retrieval gap)</tspan></text></svg>