<svg xmlns="http://www.w3.org/2000/svg" width="940" height="1160" viewBox="0 0 940 1160"><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#34495E"/></marker><marker id="ahb" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7F8C8D"/></marker></defs><rect width="100%" height="100%" fill="#FFFFFF"/><text x="470" y="22" font-family="Segoe UI, Arial, sans-serif" font-size="19" font-weight="700" fill="#1F3A5F" text-anchor="middle" dominant-baseline="central"><tspan x="470" dy="0">BP-2  Knowledge Lifecycle &amp; Freshness</tspan></text><text x="470" y="44" font-family="Segoe UI, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#5D6D7E" text-anchor="middle" dominant-baseline="central"><tspan x="470" dy="0">Author → approve → ingest → serve → retire</tspan></text><rect x="10" y="62" width="230" height="1052" fill="#F6F8FB" stroke="#C9D3DE" stroke-width="1"/><rect x="10" y="62" width="230" height="52" fill="#1F3A5F" stroke="#C9D3DE" stroke-width="1"/><text x="125" y="88" font-family="Segoe UI, Arial, sans-serif" font-size="13.5" font-weight="600" fill="#FFFFFF" text-anchor="middle" dominant-baseline="central"><tspan x="125" dy="0">Knowledge Admin</tspan></text><rect x="240" y="62" width="230" height="1052" fill="#FFFFFF" stroke="#C9D3DE" stroke-width="1"/><rect x="240" y="62" width="230" height="52" fill="#1F3A5F" stroke="#C9D3DE" stroke-width="1"/><text x="355" y="79.5625" font-family="Segoe UI, Arial, sans-serif" font-size="13.5" font-weight="600" fill="#FFFFFF" text-anchor="middle" dominant-baseline="central"><tspan x="355" dy="0">Admin Console /</tspan><tspan x="355" dy="16.875">Document Registry</tspan></text><rect x="470" y="62" width="230" height="1052" fill="#F6F8FB" stroke="#C9D3DE" stroke-width="1"/><rect x="470" y="62" width="230" height="52" fill="#1F3A5F" stroke="#C9D3DE" stroke-width="1"/><text x="585" y="88" font-family="Segoe UI, Arial, sans-serif" font-size="13.5" font-weight="600" fill="#FFFFFF" text-anchor="middle" dominant-baseline="central"><tspan x="585" dy="0">Ingestion Pipeline</tspan></text><rect x="700" y="62" width="230" height="1052" fill="#FFFFFF" stroke="#C9D3DE" stroke-width="1"/><rect x="700" y="62" width="230" height="52" fill="#1F3A5F" stroke="#C9D3DE" stroke-width="1"/><text x="815" y="79.5625" font-family="Segoe UI, Arial, sans-serif" font-size="13.5" font-weight="600" fill="#FFFFFF" text-anchor="middle" dominant-baseline="central"><tspan x="815" dy="0">Scheduler &amp;</tspan><tspan x="815" dy="16.875">Monitoring</tspan></text><path d="M125,188 L125,232.5" fill="none" stroke="#34495E" stroke-width="1.5" marker-end="url(#ah)"/><path d="M125,295.5 L125,315.25 L355,315.25 L355,335" fill="none" stroke="#34495E" stroke-width="1.5" marker-end="url(#ah)"/><path d="M355,393 L355,408 L125,408 L125,423" fill="none" stroke="#34495E" stroke-width="1.5" marker-end="url(#ah)"/><path d="M30,464 L14,464 L14,264 L30,264" fill="none" stroke="#34495E" stroke-width="1.5" marker-end="url(#ah)"/><path d="M125,505 L125,520 L355,520 L355,535" fill="none" stroke="#34495E" stroke-width="1.5" marker-end="url(#ah)"/><path d="M815,493 L815,562.75 L585,562.75 L585,632.5" fill="none" stroke="#34495E" stroke-width="1.5" marker-end="url(#ah)"/><path d="M355,593 L355,612.75 L585,612.75 L585,632.5" fill="none" stroke="#34495E" stroke-width="1.5" marker-end="url(#ah)"/><path d="M585,695.5 L585,732.5" fill="none" stroke="#34495E" stroke-width="1.5" marker-end="url(#ah)"/><path d="M585,795.5 L585,835" fill="none" stroke="#34495E" stroke-width="1.5" marker-end="url(#ah)"/><path d="M585,893 L585,923" fill="none" stroke="#34495E" stroke-width="1.5" marker-end="url(#ah)"/><path d="M490,964 L355,964 L355,1040" fill="none" stroke="#34495E" stroke-width="1.5" marker-end="url(#ah)"/><path d="M680,964 L815,964 L815,1032.5" fill="none" stroke="#34495E" stroke-width="1.5" marker-end="url(#ah)"/><path d="M910,1064 L926,1064 L926,664 L680,664" fill="none" stroke="#34495E" stroke-width="1.5" marker-end="url(#ah)"/><rect x="30" y="140" width="190" height="48" rx="24" fill="#1F3A5F" stroke="#1F3A5F" stroke-width="1.6"/><text x="125" y="155.5625" font-family="Segoe UI, Arial, sans-serif" font-size="13.5" font-weight="600" fill="#FFFFFF" text-anchor="middle" dominant-baseline="central"><tspan x="125" dy="0">New / changed content</tspan><tspan x="125" dy="16.875">(price, policy, FAQ)</tspan></text><rect x="30" y="232.5" width="190" height="63" rx="8" fill="#FFF3E0" stroke="#C77700" stroke-width="1.6"/><text x="125" y="247.125" font-family="Segoe UI, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#4A2C00" text-anchor="middle" dominant-baseline="central"><tspan x="125" dy="0">Upload file or register URL;</tspan><tspan x="125" dy="16.875">set type, authority, effective</tspan><tspan x="125" dy="16.875">&amp; expiry dates</tspan></text><rect x="260" y="335" width="190" height="58" rx="8" fill="#E8F0FB" stroke="#2F5B9A" stroke-width="1.6"/><text x="355" y="355.5625" font-family="Segoe UI, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#14284B" text-anchor="middle" dominant-baseline="central"><tspan x="355" dy="0">Store immutable draft</tspan><tspan x="355" dy="16.875">version; status = pending</tspan></text><polygon points="125,423 220,464 125,505 30,464" fill="#FFF8D6" stroke="#B08900" stroke-width="1.6"/><text x="125" y="455.5625" font-family="Segoe UI, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#3D3000" text-anchor="middle" dominant-baseline="central"><tspan x="125" dy="0">Approve as</tspan><tspan x="125" dy="16.875">authoritative?</tspan></text><rect x="720" y="435" width="190" height="58" rx="8" fill="#E7F6EE" stroke="#2E8B57" stroke-width="1.6"/><text x="815" y="455.5625" font-family="Segoe UI, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#123D27" text-anchor="middle" dominant-baseline="central"><tspan x="815" dy="0">Daily website crawl;</tspan><tspan x="815" dy="16.875">hourly expiry sweep</tspan></text><rect x="260" y="535" width="190" height="58" rx="8" fill="#E8F0FB" stroke="#2F5B9A" stroke-width="1.6"/><text x="355" y="555.5625" font-family="Segoe UI, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#14284B" text-anchor="middle" dominant-baseline="central"><tspan x="355" dy="0">Publish version; emit</tspan><tspan x="355" dy="16.875">document.approved event</tspan></text><rect x="490" y="632.5" width="190" height="63" rx="8" fill="#E7F6EE" stroke="#2E8B57" stroke-width="1.6"/><text x="585" y="647.125" font-family="Segoe UI, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#123D27" text-anchor="middle" dominant-baseline="central"><tspan x="585" dy="0">Load → clean → structure-</tspan><tspan x="585" dy="16.875">aware chunk (~500 tokens,</tspan><tspan x="585" dy="16.875">75 overlap)</tspan></text><rect x="490" y="732.5" width="190" height="63" rx="8" fill="#E7F6EE" stroke="#2E8B57" stroke-width="1.6"/><text x="585" y="747.125" font-family="Segoe UI, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#123D27" text-anchor="middle" dominant-baseline="central"><tspan x="585" dy="0">Embed (text-embedding-</tspan><tspan x="585" dy="16.875">3-small); upsert to tenant</tspan><tspan x="585" dy="16.875">namespace with metadata</tspan></text><rect x="490" y="835" width="190" height="58" rx="8" fill="#E7F6EE" stroke="#2E8B57" stroke-width="1.6"/><text x="585" y="855.5625" font-family="Segoe UI, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#123D27" text-anchor="middle" dominant-baseline="central"><tspan x="585" dy="0">Retire superseded / expired</tspan><tspan x="585" dy="16.875">vectors; update registry</tspan></text><polygon points="585,923 680,964 585,1005 490,964" fill="#FFF8D6" stroke="#B08900" stroke-width="1.6"/><text x="585" y="955.5625" font-family="Segoe UI, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#3D3000" text-anchor="middle" dominant-baseline="central"><tspan x="585" dy="0">Succeeded within</tspan><tspan x="585" dy="16.875">freshness SLA?</tspan></text><rect x="720" y="1032.5" width="190" height="63" rx="8" fill="#FDECEC" stroke="#C0392B" stroke-width="1.6"/><text x="815" y="1047.125" font-family="Segoe UI, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#5C1010" text-anchor="middle" dominant-baseline="central"><tspan x="815" dy="0">Alert admin &amp; ops;</tspan><tspan x="815" dy="16.875">retry with backoff;</tspan><tspan x="815" dy="16.875">quarantine bad file</tspan></text><rect x="260" y="1040" width="190" height="48" rx="24" fill="#1F3A5F" stroke="#1F3A5F" stroke-width="1.6"/><text x="355" y="1055.5625" font-family="Segoe UI, Arial, sans-serif" font-size="13.5" font-weight="600" fill="#FFFFFF" text-anchor="middle" dominant-baseline="central"><tspan x="355" dy="0">Version live</tspan><tspan x="355" dy="16.875">for retrieval</tspan></text><rect x="22" y="354" width="76" height="20" rx="3" fill="#FFFFFF" stroke="#D5DBDB" stroke-width="0.8"/><text x="60" y="364" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="400" fill="#34495E" text-anchor="middle" dominant-baseline="central" font-style="italic"><tspan x="60" dy="0">No: revise</tspan></text><rect x="224.4" y="510" width="31.200000000000003" height="20" rx="3" fill="#FFFFFF" stroke="#D5DBDB" stroke-width="0.8"/><text x="240" y="520" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="400" fill="#34495E" text-anchor="middle" dominant-baseline="central" font-style="italic"><tspan x="240" dy="0">Yes</tspan></text><rect x="665.2" y="545.25" width="69.6" height="35" rx="3" fill="#FFFFFF" stroke="#D5DBDB" stroke-width="0.8"/><text x="700" y="555.25" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="400" fill="#34495E" text-anchor="middle" dominant-baseline="central" font-style="italic"><tspan x="700" dy="0">scheduled</tspan><tspan x="700" dy="15">changes</tspan></text><rect x="406.9" y="954" width="31.200000000000003" height="20" rx="3" fill="#FFFFFF" stroke="#D5DBDB" stroke-width="0.8"/><text x="422.5" y="964" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="400" fill="#34495E" text-anchor="middle" dominant-baseline="central" font-style="italic"><tspan x="422.5" dy="0">Yes</tspan></text><rect x="735.1" y="954" width="24.8" height="20" rx="3" fill="#FFFFFF" stroke="#D5DBDB" stroke-width="0.8"/><text x="747.5" y="964" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="400" fill="#34495E" text-anchor="middle" dominant-baseline="central" font-style="italic"><tspan x="747.5" dy="0">No</tspan></text><rect x="874" y="854" width="44" height="20" rx="3" fill="#FFFFFF" stroke="#D5DBDB" stroke-width="0.8"/><text x="896" y="864" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="400" fill="#34495E" text-anchor="middle" dominant-baseline="central" font-style="italic"><tspan x="896" dy="0">retry</tspan></text><text x="470" y="1136" font-family="Segoe UI, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#34495E" text-anchor="middle" dominant-baseline="central" font-style="italic"><tspan x="470" dy="0">Freshness SLA: pricing, policy &amp; warranty changes ≤ 15 min after approval; general knowledge ≤ 24 h.</tspan></text></svg>