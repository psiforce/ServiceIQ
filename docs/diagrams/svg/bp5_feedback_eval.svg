oke-width="1"/><rect x="470" y="62" width="230" height="52" fill="#1F3A5F" stroke="#C9D3DE" stroke-width="1"/><text x="585" y="79.5625" font-family="Segoe UI, Arial, sans-serif" font-size="13.5" font-weight="600" fill="#FFFFFF" text-anchor="middle" dominant-baseline="central"><tspan x="585" dy="0">AI / Evaluation</tspan><tspan x="585" dy="16.875">Engineer</tspan></text><rect x="700" y="62" width="230" height="1152" fill="#FFFFFF" stroke="#C9D3DE" stroke-width="1"/><rect x="700" y="62" width="230" height="52" fill="#1F3A5F" stroke="#C9D3DE" stroke-width="1"/><text x="815" y="79.5625" font-family="Segoe UI, Arial, sans-serif" font-size="13.5" font-weight="600" fill="#FFFFFF" text-anchor="middle" dominant-baseline="central"><tspan x="815" dy="0">CI/CD &amp; Eval Harness</tspan><tspan x="815" dy="16.875">(Ragas)</tspan></text><path d="M355,188 L355,332.5" fill="none" stroke="#34495E" stroke-width="1.5" marker-end="url(#ah)"/><path d="M125,293 L125,312.75 L355,312.75 L355,332.5" fill="none" stroke="#34495E" stroke-width="1.5" marker-end="url(#ah)"/><path d="M355,395.5 L355,415.25 L585,415.25 L585,435" fill="none" stroke="#34495E" stroke-width="1.5" marker-end="url(#ah)"/><path d="M585,493 L585,523" fill="none" stroke="#34495E" stroke-width="1.5" marker-end="url(#ah)"/><path d="M490,564 L220,564" fill="none" stroke="#34495E" stroke-width="1.5" marker-end="url(#ah)"/><path d="M585,605 L585,632.5" fill="none" stroke="#34495E" stroke-width="1.5" marker-end="url(#ah)"/><path d="M585,695.5 L585,735" fill="none" stroke="#34495E" stroke-width="1.5" marker-end="url(#ah)"/><path d="M585,793 L585,812.75 L815,812.75 L815,832.5" fill="none" stroke="#34495E" stroke-width="1.5" marker-end="url(#ah)"/><path d="M125,593 L125,814 L815,814 L815,832.5" fill="none" stroke="#34495E" stroke-width="1.5" marker-end="url(#ah)"/><path d="M815,895.5 L815,923" fill="none" stroke="#34495E" stroke-width="1.5" marker-end="url(#ah)"/><path d="M720,964 L474,964 L474,764 L490,764" fill="none" stroke="#34495E" stroke-width="1.5" marker-end="url(#ah)"/><path d="M815,1005 L815,1035" fill="none" stroke="#34495E" stroke-width="1.5" marker-end="url(#ah)"/><path d="M815,1093 L815,1116.5 L355,1116.5 L355,1140" fill="none" stroke="#34495E" stroke-width="1.5" marker-end="url(#ah)"/><rect x="260" y="140" width="190" height="48" rx="24" fill="#1F3A5F" stroke="#1F3A5F" stroke-width="1.6"/><text x="355" y="155.5625" font-family="Segoe UI, Arial, sans-serif" font-size="13.5" font-weight="600" fill="#FFFFFF" text-anchor="middle" dominant-baseline="central"><tspan x="355" dy="0">Every conversation traced</tspan><tspan x="355" dy="16.875">(PII-redacted)</tspan></text><rect x="30" y="235" width="190" height="58" rx="8" fill="#FFF3E0" stroke="#C77700" stroke-width="1.6"/><text x="125" y="255.5625" font-family="Segoe UI, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#4A2C00" text-anchor="middle" dominant-baseline="central"><tspan x="125" dy="0">Rate answer (up/down);</tspan><tspan x="125" dy="16.875">CSR flags bad answers</tspan></text><rect x="260" y="332.5" width="190" height="63" rx="8" fill="#E7F6EE" stroke="#2E8B57" stroke-width="1.6"/><text x="355" y="347.125" font-family="Segoe UI, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#123D27" text-anchor="middle" dominant-baseline="central"><tspan x="355" dy="0">Auto-flag: negative rating,</tspan><tspan x="355" dy="16.875">low grounding, fallback,</tspan><tspan x="355" dy="16.875">latency &gt; 5 s</tspan></text><rect x="490" y="435" width="190" height="58" rx="8" fill="#FFF3E0" stroke="#C77700" stroke-width="1.6"/><text x="585" y="455.5625" font-family="Segoe UI, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#4A2C00" text-anchor="middle" dominant-baseline="central"><tspan x="585" dy="0">Triage flagged</tspan><tspan x="585" dy="16.875">conversations (weekly)</tspan></text><polygon points="585,523 680,564 585,605 490,564" fill="#FFF8D6" stroke="#B08900" stroke-width="1.6"/><text x="585" y="564" font-family="Segoe UI, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#3D3000" text-anchor="middle" dominant-baseline="central"><tspan x="585" dy="0">Root cause?</tspan></text><rect x="30" y="535" width="190" height="58" rx="8" fill="#FFF3E0" stroke="#C77700" stroke-width="1.6"/><text x="125" y="555.5625" font-family="Segoe UI, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#4A2C00" text-anchor="middle" dominant-baseline="central"><tspan x="125" dy="0">Add / fix content</tspan><tspan x="125" dy="16.875">via BP-2</tspan></text><rect x="490" y="632.5" width="190" height="63" rx="8" fill="#FFF3E0" stroke="#C77700" stroke-width="1.6"/><text x="585" y="647.125" font-family="Segoe UI, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#4A2C00" text-anchor="middle" dominant-baseline="central"><tspan x="585" dy="0">Add case to eval set:</tspan><tspan x="585" dy="16.875">question, reference answer,</tspan><tspan x="585" dy="16.875">relevant source IDs</tspan></text><rect x="490" y="735" width="190" height="58" rx="8" fill="#FFF3E0" stroke="#C77700" stroke-width="1.6"/><text x="585" y="755.5625" font-family="Segoe UI, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#4A2C00" text-anchor="middle" dominant-baseline="central"><tspan x="585" dy="0">Change chunking, top_k,</tspan><tspan x="585" dy="16.875">reranker, prompt or model</tspan></text><rect x="720" y="832.5" width="190" height="63" rx="8" fill="#E7F6EE" stroke="#2E8B57" stroke-width="1.6"/><text x="815" y="847.125" font-family="Segoe UI, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#123D27" text-anchor="middle" dominant-baseline="central"><tspan x="815" dy="0">Run regression suite</tspan><tspan x="815" dy="16.875">(≥100 questions): Ragas +</tspan><tspan x="815" dy="16.875">pricing/policy checks</tspan></text><polygon points="815,923 910,964 815,1005 720,964" fill="#FFF8D6" stroke="#B08900" stroke-width="1.6"/><text x="815" y="955.5625" font-family="Segoe UI, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#3D3000" text-anchor="middle" dominant-baseline="central"><tspan x="815" dy="0">All release</tspan><tspan x="815" dy="16.875">gates met?</tspan></text><rect x="720" y="1035" width="190" height="58" rx="8" fill="#E7F6EE" stroke="#2E8B57" stroke-width="1.6"/><text x="815" y="1055.5625" font-family="Segoe UI, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#123D27" text-anchor="middle" dominant-baseline="central"><tspan x="815" dy="0">Deploy staging → prod;</tspan><tspan x="815" dy="16.875">record new baseline</tspan></text><rect x="260" y="1140" width="190" height="48" rx="24" fill="#1F3A5F" stroke="#1F3A5F" stroke-width="1.6"/><text x="355" y="1155.5625" font-family="Segoe UI, Arial, sans-serif" font-size="13.5" font-weight="600" fill="#FFFFFF" text-anchor="middle" dominant-baseline="central"><tspan x="355" dy="0">Dashboards &amp; KPI</tspan><tspan x="355" dy="16.875">report updated</tspan></text><rect x="307.4" y="554" width="95.2" height="20" rx="3" fill="#FFFFFF" stroke="#D5DBDB" stroke-width="0.8"/><text x="355" y="564" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="400" fill="#34495E" text-anchor="middle" dominant-baseline="central" font-style="italic"><tspan x="355" dy="0">Knowledge gap</tspan></text><rect x="524.6" y="601.25" width="120.80000000000001" height="35" rx="3" fill="#FFFFFF" stroke="#D5DBDB" stroke-width="0.8"/><text x="585" y="611.25" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="400" fill="#34495E" text-anchor="middle" dominant-baseline="central" font-style="italic"><tspan x="585" dy="0">Retrieval /</tspan><tspan x="585" dy="15">generation defect</tspan></text><rect x="191.6" y="804" width="56.800000000000004" height="20" rx="3" fill="#FFFFFF" stroke="#D5DBDB" stroke-width="0.8"/><text x="220" y="814" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="400" fill="#34495E" text-anchor="middle" dominant-baseline="central" font-style="italic"><tspan x="220" dy="0">re-test</tspan></text><rect x="507.6" y="854" width="24.8" height="20" rx="3" fill="#FFFFFF" stroke="#D5DBDB" stroke-width="0.8"/><text x="520" y="864" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="400" fill="#34495E" text-anchor="middle" dominant-baseline="central" font-style="italic"><tspan x="520" dy="0">No</tspan></text><rect x="799.4" y="1010" width="31.200000000000003" height="20" rx="3" fill="#FFFFFF" stroke="#D5DBDB" stroke-width="0.8"/><text x="815" y="1020" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="400" fill="#34495E" text-anchor="middle" dominant-baseline="central" font-style="italic"><tspan x="815" dy="0">Yes</tspan></text><text x="470" y="1236" font-family="Segoe UI, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#34495E" text-anchor="middle" dominant-baseline="central" font-style="italic"><tspan x="470" dy="0">Gates: faithfulness ≥95% · Recall@5 ≥90% · citation accuracy ≥95% · unsupported-answer handling ≥95% · 0 critical pricing/policy errors · P95 ≤5 s</tspan></text></svg>