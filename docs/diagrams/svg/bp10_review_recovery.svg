<svg xmlns="http://www.w3.org/2000/svg" width="860" height="960" viewBox="0 0 860 960"><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#34495E"/></marker><marker id="ahb" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7F8C8D"/></marker></defs><rect width="100%" height="100%" fill="#FFFFFF"/><text x="430" y="22" font-family="Segoe UI, Arial, sans-serif" font-size="19" font-weight="700" fill="#1F3A5F" text-anchor="middle" dominant-baseline="central"><tspan x="430" dy="0">BP-10  Review &amp; Service Recovery (Phase 4)</tspan></text><text x="430" y="44" font-family="Segoe UI, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#5D6D7E" text-anchor="middle" dominant-baseline="central"><tspan x="430" dy="0">Every customer is asked and every reviewer sees the public link; low ratings start a recovery</tspan></text><rect x="10" y="62" width="280" height="852" fill="#F6F8FB" stroke="#C9D3DE" stroke-width="1"/><rect x="10" y="62" width="280" height="52" fill="#1F3A5F" stroke="#C9D3DE" stroke-width="1"/><text x="150" y="88" font-family="Segoe UI, Arial, sans-serif" font-size="13.5" font-weight="600" fill="#FFFFFF" text-anchor="middle" dominant-baseline="central"><tspan x="150" dy="0">Customer</tspan></text><rect x="290" y="62" width="280" height="852" fill="#FFFFFF" stroke="#C9D3DE" stroke-width="1"/><rect x="290" y="62" width="280" height="52" fill="#1F3A5F" stroke="#C9D3DE" stroke-width="1"/><text x="430" y="88" font-family="Segoe UI, Arial, sans-serif" font-size="13.5" font-weight="600" fill="#FFFFFF" text-anchor="middle" dominant-baseline="central"><tspan x="430" dy="0">ServiceIQ Agent</tspan></text><rect x="570" y="62" width="280" height="852" fill="#F6F8FB" stroke="#C9D3DE" stroke-width="1"/><rect x="570" y="62" width="280" height="52" fill="#1F3A5F" stroke="#C9D3DE" stroke-width="1"/><text x="710" y="88" font-family="Segoe UI, Arial, sans-serif" font-size="13.5" font-weight="600" fill="#FFFFFF" text-anchor="middle" dominant-baseline="central"><tspan x="710" dy="0">Admin / Service Manager</tspan></text><path d="M430,186 L430,232.5" fill="none" stroke="#34495E" stroke-width="1.5" marker-end="url(#ah)"/><path d="M430,295.5 L430,315.25 L150,315.25 L150,335" fill="none" stroke="#34495E" stroke-width="1.5" marker-end="url(#ah)"/><path d="M430,295.5 L430,314 L710,314 L710,332.5" fill="none" stroke="#34495E" stroke-width="1.5" stroke-dasharray="6 4" marker-end="url(#ah)"/><path d="M150,393 L150,412.75 L430,412.75 L430,432.5" fill="none" stroke="#34495E" stroke-width="1.5" marker-end="url(#ah)"/><path d="M430,495.5 L430,532.5" fill="none" stroke="#34495E" stroke-width="1.5" marker-end="url(#ah)"/><path d="M430,595.5 L430,623" fill="none" stroke="#34495E" stroke-width="1.5" marker-end="url(#ah)"/><path d="M550,664 L590,664" fill="none" stroke="#34495E" stroke-width="1.5" marker-end="url(#ah)"/><path d="M430,705 L430,742" fill="none" stroke="#34495E" stroke-width="1.5" marker-end="url(#ah)"/><path d="M710,695.5 L710,732.5" fill="none" stroke="#34495E" stroke-width="1.5" marker-end="url(#ah)"/><path d="M710,795.5 L710,840" fill="none" stroke="#34495E" stroke-width="1.5" marker-end="url(#ah)"/><rect x="310" y="142" width="240" height="44" rx="22" fill="#1F3A5F" stroke="#1F3A5F" stroke-width="1.6"/><text x="430" y="164" font-family="Segoe UI, Arial, sans-serif" font-size="13.5" font-weight="600" fill="#FFFFFF" text-anchor="middle" dominant-baseline="central"><tspan x="430" dy="0">Invoice paid (BP-9)</tspan></text><rect x="310" y="232.5" width="240" height="63" rx="8" fill="#E7F6EE" stroke="#2E8B57" stroke-width="1.6"/><text x="430" y="247.125" font-family="Segoe UI, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#123D27" text-anchor="middle" dominant-baseline="central"><tspan x="430" dy="0">request_review: email a link</tspan><tspan x="430" dy="16.875">back to the same conversation</tspan><tspan x="430" dy="16.875">(signed token)</tspan></text><rect x="30" y="335" width="240" height="58" rx="8" fill="#FFF3E0" stroke="#C77700" stroke-width="1.6"/><text x="150" y="355.5625" font-family="Segoe UI, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#4A2C00" text-anchor="middle" dominant-baseline="central"><tspan x="150" dy="0">Opens chat; gives a</tspan><tspan x="150" dy="16.875">1–5 rating and a comment</tspan></text><rect x="590" y="332.5" width="240" height="63" rx="8" fill="#EEF2F5" stroke="#5D6D7E" stroke-width="1.6"/><text x="710" y="347.125" font-family="Segoe UI, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#1C2833" text-anchor="middle" dominant-baseline="central"><tspan x="710" dy="0">No reply in 7 days:</tspan><tspan x="710" dy="16.875">one reminder, then close</tspan><tspan x="710" dy="16.875">without a review</tspan></text><rect x="310" y="432.5" width="240" height="63" rx="8" fill="#E7F6EE" stroke="#2E8B57" stroke-width="1.6"/><text x="430" y="447.125" font-family="Segoe UI, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#123D27" text-anchor="middle" dominant-baseline="central"><tspan x="430" dy="0">record_review: guard checks</tspan><tspan x="430" dy="16.875">the comment, PII redacted,</tspan><tspan x="430" dy="16.875">Review stored</tspan></text><rect x="310" y="532.5" width="240" height="63" rx="8" fill="#E7F6EE" stroke="#2E8B57" stroke-width="1.6"/><text x="430" y="547.125" font-family="Segoe UI, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#123D27" text-anchor="middle" dominant-baseline="central"><tspan x="430" dy="0">Thank the customer; show the</tspan><tspan x="430" dy="16.875">public review link to every</tspan><tspan x="430" dy="16.875">reviewer (no rating gating)</tspan></text><polygon points="430,623 550,664 430,705 310,664" fill="#FFF8D6" stroke="#B08900" stroke-width="1.6"/><text x="430" y="664" font-family="Segoe UI, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#3D3000" text-anchor="middle" dominant-baseline="central"><tspan x="430" dy="0">Rating ≤ 3?</tspan></text><rect x="590" y="632.5" width="240" height="63" rx="8" fill="#FDECEC" stroke="#C0392B" stroke-width="1.6"/><text x="710" y="647.125" font-family="Segoe UI, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#5C1010" text-anchor="middle" dominant-baseline="central"><tspan x="710" dy="0">Recovery ticket (P2) +</tspan><tspan x="710" dy="16.875">admin email with the</tspan><tspan x="710" dy="16.875">job and comment</tspan></text><rect x="310" y="742" width="240" height="44" rx="22" fill="#1F3A5F" stroke="#1F3A5F" stroke-width="1.6"/><text x="430" y="764" font-family="Segoe UI, Arial, sans-serif" font-size="13.5" font-weight="600" fill="#FFFFFF" text-anchor="middle" dominant-baseline="central"><tspan x="430" dy="0">stage = reviewed</tspan></text><rect x="590" y="732.5" width="240" height="63" rx="8" fill="#FFF3E0" stroke="#C77700" stroke-width="1.6"/><text x="710" y="747.125" font-family="Segoe UI, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#4A2C00" text-anchor="middle" dominant-baseline="central"><tspan x="710" dy="0">Calls the customer: fix,</tspan><tspan x="710" dy="16.875">revisit or goodwill credit</tspan><tspan x="710" dy="16.875">(credit needs approval)</tspan></text><rect x="590" y="840" width="240" height="48" rx="24" fill="#1F3A5F" stroke="#1F3A5F" stroke-width="1.6"/><text x="710" y="855.5625" font-family="Segoe UI, Arial, sans-serif" font-size="13.5" font-weight="600" fill="#FFFFFF" text-anchor="middle" dominant-baseline="central"><tspan x="710" dy="0">stage = recovery → resolved;</tspan><tspan x="710" dy="16.875">outcome logged</tspan></text><rect x="538.4" y="304" width="63.2" height="20" rx="3" fill="#FFFFFF" stroke="#D5DBDB" stroke-width="0.8"/><text x="570" y="314" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="400" fill="#34495E" text-anchor="middle" dominant-baseline="central" font-style="italic"><tspan x="570" dy="0">no reply</tspan></text><rect x="554.4" y="654" width="31.200000000000003" height="20" rx="3" fill="#FFFFFF" stroke="#D5DBDB" stroke-width="0.8"/><text x="570" y="664" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="400" fill="#34495E" text-anchor="middle" dominant-baseline="central" font-style="italic"><tspan x="570" dy="0">Yes</tspan></text><rect x="417.6" y="713.5" width="24.8" height="20" rx="3" fill="#FFFFFF" stroke="#D5DBDB" stroke-width="0.8"/><text x="430" y="723.5" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="400" fill="#34495E" text-anchor="middle" dominant-baseline="central" font-style="italic"><tspan x="430" dy="0">No</tspan></text><text x="430" y="936" font-family="Segoe UI, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#34495E" text-anchor="middle" dominant-baseline="central" font-style="italic"><tspan x="430" dy="0">Asking everyone and showing the public link to all avoids review gating (Google review policy; FTC consumer-review rule).</tspan></text></svg>