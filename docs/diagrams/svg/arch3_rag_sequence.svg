<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="882" viewBox="0 0 1200 882"><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#34495E"/></marker><marker id="ahb" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7F8C8D"/></marker></defs><rect width="100%" height="100%" fill="#FFFFFF"/><text x="600" y="22" font-family="Segoe UI, Arial, sans-serif" font-size="19" font-weight="700" fill="#1F3A5F" text-anchor="middle" dominant-baseline="central"><tspan x="600" dy="0">RAG Query Pipeline (runtime sequence)</tspan></text><text x="600" y="44" font-family="Segoe UI, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#5D6D7E" text-anchor="middle" dominant-baseline="central"><tspan x="600" dy="0">Budget: P95 ≤ 5 s end-to-end; answer streams to the widget</tspan></text><line x1="92.5" y1="118" x2="92.5" y2="872" stroke="#AEB6BF" stroke-width="1.2" stroke-dasharray="5 4"/><rect x="28" y="62" width="129" height="56" rx="7" fill="#FFF3E0" stroke="#C77700" stroke-width="1.6"/><text x="92.5" y="90" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="600" fill="#4A2C00" text-anchor="middle" dominant-baseline="central"><tspan x="92.5" dy="0">Chat Widget</tspan></text><line x1="237.5" y1="118" x2="237.5" y2="872" stroke="#AEB6BF" stroke-width="1.2" stroke-dasharray="5 4"/><rect x="173" y="62" width="129" height="56" rx="7" fill="#E8F0FB" stroke="#2F5B9A" stroke-width="1.6"/><text x="237.5" y="90" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="600" fill="#14284B" text-anchor="middle" dominant-baseline="central"><tspan x="237.5" dy="0">API Gateway</tspan></text><line x1="382.5" y1="118" x2="382.5" y2="872" stroke="#AEB6BF" stroke-width="1.2" stroke-dasharray="5 4"/><rect x="318" y="62" width="129" height="56" rx="7" fill="#E7F6EE" stroke="#2E8B57" stroke-width="1.6"/><text x="382.5" y="90" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="600" fill="#123D27" text-anchor="middle" dominant-baseline="central"><tspan x="382.5" dy="0">RAG Service</tspan></text><line x1="527.5" y1="118" x2="527.5" y2="872" stroke="#AEB6BF" stroke-width="1.2" stroke-dasharray="5 4"/><rect x="463" y="62" width="129" height="56" rx="7" fill="#E7F6EE" stroke="#2E8B57" stroke-width="1.6"/><text x="527.5" y="90" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="600" fill="#123D27" text-anchor="middle" dominant-baseline="central"><tspan x="527.5" dy="0">Guardrails</tspan></text><line x1="672.5" y1="118" x2="672.5" y2="872" stroke="#AEB6BF" stroke-width="1.2" stroke-dasharray="5 4"/><rect x="608" y="62" width="129" height="56" rx="7" fill="#F1ECFA" stroke="#6A4BA3" stroke-width="1.6"/><text x="672.5" y="81.875" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="600" fill="#2E1A55" text-anchor="middle" dominant-baseline="central"><tspan x="672.5" dy="0">OpenAI</tspan><tspan x="672.5" dy="16.25">(embed / LLM)</tspan></text><line x1="817.5" y1="118" x2="817.5" y2="872" stroke="#AEB6BF" stroke-width="1.2" stroke-dasharray="5 4"/><rect x="753" y="62" width="129" height="56" rx="7" fill="#F1ECFA" stroke="#6A4BA3" stroke-width="1.6"/><text x="817.5" y="90" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="600" fill="#2E1A55" text-anchor="middle" dominant-baseline="central"><tspan x="817.5" dy="0">Pinecone</tspan></text><line x1="962.5" y1="118" x2="962.5" y2="872" stroke="#AEB6BF" stroke-width="1.2" stroke-dasharray="5 4"/><rect x="898" y="62" width="129" height="56" rx="7" fill="#E7F6EE" stroke="#2E8B57" stroke-width="1.6"/><text x="962.5" y="90" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="600" fill="#123D27" text-anchor="middle" dominant-baseline="central"><tspan x="962.5" dy="0">Reranker</tspan></text><line x1="1107.5" y1="118" x2="1107.5" y2="872" stroke="#AEB6BF" stroke-width="1.2" stroke-dasharray="5 4"/><rect x="1043" y="62" width="129" height="56" rx="7" fill="#EEF2F5" stroke="#5D6D7E" stroke-width="1.6"/><text x="1107.5" y="81.875" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="600" fill="#1C2833" text-anchor="middle" dominant-baseline="central"><tspan x="1107.5" dy="0">Postgres /</tspan><tspan x="1107.5" dy="16.25">LangSmith</tspan></text><path d="M92.5,156 H235.5" fill="none" stroke="#34495E" stroke-width="1.5" marker-end="url(#ah)"/><rect x="28.900000000000006" y="132" width="272.2" height="18" fill="#FFFFFF" opacity="0.92"/><text x="165" y="140" font-family="Segoe UI, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#1C2833" text-anchor="middle" dominant-baseline="central"><tspan x="165" dy="0">1. POST /v1/chat (widget key, session)</tspan></text><path d="M237.5,200 H380.5" fill="none" stroke="#34495E" stroke-width="1.5" marker-end="url(#ah)"/><rect x="180.8" y="176" width="258.4" height="18" fill="#FFFFFF" opacity="0.92"/><text x="310" y="184" font-family="Segoe UI, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#1C2833" text-anchor="middle" dominant-baseline="central"><tspan x="310" dy="0">2. authenticated request + tenant_id</tspan></text><path d="M382.5,244 H525.5" fill="none" stroke="#34495E" stroke-width="1.5" marker-end="url(#ah)"/><rect x="305.1" y="220" width="299.8" height="18" fill="#FFFFFF" opacity="0.92"/><text x="455" y="228" font-family="Segoe UI, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#1C2833" text-anchor="middle" dominant-baseline="central"><tspan x="455" dy="0">3. input checks: PII, injection, emergency</tspan></text><rect x="24" y="266" width="1152" height="28" rx="4" fill="#FFF8D6" stroke="#B08900" stroke-width="0.8"/><text x="40" y="280" font-family="Segoe UI, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#3D3000" text-anchor="start" dominant-baseline="central" font-style="italic"><tspan x="40" dy="0">alt  emergency detected → return safety script, page on-call (BP-4), stop</tspan></text><path d="M382.5,326 H670.5" fill="none" stroke="#34495E" stroke-width="1.5" marker-end="url(#ah)"/><rect x="387.95" y="302" width="279.1" height="18" fill="#FFFFFF" opacity="0.92"/><text x="527.5" y="310" font-family="Segoe UI, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#1C2833" text-anchor="middle" dominant-baseline="central"><tspan x="527.5" dy="0">4. embed query (text-embedding-3-small)</tspan></text><path d="M382.5,378 H815.5" fill="none" stroke="#34495E" stroke-width="1.5" marker-end="url(#ah)"/><rect x="401.79999999999995" y="338" width="396.40000000000003" height="34" fill="#FFFFFF" opacity="0.92"/><text x="600" y="346.1875" font-family="Segoe UI, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#1C2833" text-anchor="middle" dominant-baseline="central"><tspan x="600" dy="0">5. query top_k=10 in tenant namespace;</tspan><tspan x="600" dy="15.625">filter: approved, effective ≤ now &lt; expiry, access_scope</tspan></text><path d="M817.5,428 H384.5" fill="none" stroke="#5D6D7E" stroke-width="1.5" stroke-dasharray="6 4" marker-end="url(#ah)"/><rect x="481.15" y="404" width="237.70000000000002" height="18" fill="#FFFFFF" opacity="0.92"/><text x="600" y="412" font-family="Segoe UI, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#1C2833" text-anchor="middle" dominant-baseline="central"><tspan x="600" dy="0">6. 10 candidate chunks + metadata</tspan></text><path d="M382.5,472 H960.5" fill="none" stroke="#34495E" stroke-width="1.5" marker-end="url(#ah)"/><rect x="598.5" y="448" width="148" height="18" fill="#FFFFFF" opacity="0.92"/><text x="672.5" y="456" font-family="Segoe UI, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#1C2833" text-anchor="middle" dominant-baseline="central"><tspan x="672.5" dy="0">7. rerank candidates</tspan></text><path d="M962.5,516 H384.5" fill="none" stroke="#5D6D7E" stroke-width="1.5" stroke-dasharray="6 4" marker-end="url(#ah)"/><rect x="584.7" y="492" width="175.60000000000002" height="18" fill="#FFFFFF" opacity="0.92"/><text x="672.5" y="500" font-family="Segoe UI, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#1C2833" text-anchor="middle" dominant-baseline="central"><tspan x="672.5" dy="0">8. top 5 evidence chunks</tspan></text><path d="M382.5,554 H416.5 V576 H386.5" fill="none" stroke="#34495E" stroke-width="1.5" marker-end="url(#ah)"/><rect x="422.5" y="546" width="470.3" height="20" fill="#FFFFFF" opacity="0.92"/><text x="426.5" y="564" font-family="Segoe UI, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#1C2833" text-anchor="start" dominant-baseline="central"><tspan x="426.5" dy="0">9. resolve conflicts (authority, effective date); sufficiency check</tspan></text><rect x="24" y="600" width="1152" height="28" rx="4" fill="#FFF8D6" stroke="#B08900" stroke-width="0.8"/><text x="40" y="614" font-family="Segoe UI, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#3D3000" text-anchor="start" dominant-baseline="central" font-style="italic"><tspan x="40" dy="0">alt  insufficient or conflicting evidence → fallback message + escalation offer (BP-4)</tspan></text><path d="M382.5,660 H670.5" fill="none" stroke="#34495E" stroke-width="1.5" marker-end="url(#ah)"/><rect x="312.04999999999995" y="636" width="430.90000000000003" height="18" fill="#FFFFFF" opacity="0.92"/><text x="527.5" y="644" font-family="Segoe UI, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#1C2833" text-anchor="middle" dominant-baseline="central"><tspan x="527.5" dy="0">10. generate: rules + evidence (as untrusted data) + question</tspan></text><path d="M672.5,704 H384.5" fill="none" stroke="#5D6D7E" stroke-width="1.5" stroke-dasharray="6 4" marker-end="url(#ah)"/><rect x="398.3" y="680" width="258.4" height="18" fill="#FFFFFF" opacity="0.92"/><text x="527.5" y="688" font-family="Segoe UI, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#1C2833" text-anchor="middle" dominant-baseline="central"><tspan x="527.5" dy="0">11. answer with [n] citation markers</tspan></text><path d="M382.5,748 H525.5" fill="none" stroke="#34495E" stroke-width="1.5" marker-end="url(#ah)"/><rect x="225.75" y="724" width="458.5" height="18" fill="#FFFFFF" opacity="0.92"/><text x="455" y="732" font-family="Segoe UI, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#1C2833" text-anchor="middle" dominant-baseline="central"><tspan x="455" dy="0">12. output check: each claim cited; no unsupported price/warranty</tspan></text><path d="M382.5,792 H1105.5" fill="none" stroke="#34495E" stroke-width="1.5" marker-end="url(#ah)"/><rect x="598.55" y="768" width="292.90000000000003" height="18" fill="#FFFFFF" opacity="0.92"/><text x="745" y="776" font-family="Segoe UI, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#1C2833" text-anchor="middle" dominant-baseline="central"><tspan x="745" dy="0">13. log trace, citations, tokens, latency</tspan></text><path d="M382.5,836 H94.5" fill="none" stroke="#5D6D7E" stroke-width="1.5" stroke-dasharray="6 4" marker-end="url(#ah)"/><rect x="8.25" y="812" width="458.5" height="18" fill="#FFFFFF" opacity="0.92"/><text x="237.5" y="820" font-family="Segoe UI, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#1C2833" text-anchor="middle" dominant-baseline="central"><tspan x="237.5" dy="0">14. answer + citations + status (answered | fallback | escalated)</tspan></text></svg>