<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="1060" viewBox="0 0 1120 1060"><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#34495E"/></marker><marker id="ahb" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7F8C8D"/></marker></defs><rect width="100%" height="100%" fill="#FFFFFF"/><text x="560" y="22" font-family="Segoe UI, Arial, sans-serif" font-size="19" font-weight="700" fill="#1F3A5F" text-anchor="middle" dominant-baseline="central"><tspan x="560" dy="0">BP-8  Job Completion &amp; Invoicing (Phase 4)</tspan></text><text x="560" y="44" font-family="Segoe UI, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#5D6D7E" text-anchor="middle" dominant-baseline="central"><tspan x="560" dy="0">Technician completes the job → policy-checked invoice → secure payment link</tspan></text><rect x="10" y="62" width="220" height="952" fill="#F6F8FB" stroke="#C9D3DE" stroke-width="1"/><rect x="10" y="62" width="220" height="52" fill="#1F3A5F" stroke="#C9D3DE" stroke-width="1"/><text x="120" y="88" font-family="Segoe UI, Arial, sans-serif" font-size="13.5" font-weight="600" fill="#FFFFFF" text-anchor="middle" dominant-baseline="central"><tspan x="120" dy="0">Technician</tspan></text><rect x="230" y="62" width="220" height="952" fill="#FFFFFF" stroke="#C9D3DE" stroke-width="1"/><rect x="230" y="62" width="220" height="52" fill="#1F3A5F" stroke="#C9D3DE" stroke-width="1"/><text x="340" y="79.5625" font-family="Segoe UI, Arial, sans-serif" font-size="13.5" font-weight="600" fill="#FFFFFF" text-anchor="middle" dominant-baseline="central"><tspan x="340" dy="0">Scheduling Service</tspan><tspan x="340" dy="16.875">(fieldservice)</tspan></text><rect x="450" y="62" width="220" height="952" fill="#F6F8FB" stroke="#C9D3DE" stroke-width="1"/><rect x="450" y="62" width="220" height="52" fill="#1F3A5F" stroke="#C9D3DE" stroke-width="1"/><text x="560" y="88" font-family="Segoe UI, Arial, sans-serif" font-size="13.5" font-weight="600" fill="#FFFFFF" text-anchor="middle" dominant-baseline="central"><tspan x="560" dy="0">ServiceIQ Agent</tspan></text><rect x="670" y="62" width="220" height="952" fill="#FFFFFF" stroke="#C9D3DE" stroke-width="1"/><rect x="670" y="62" width="220" height="52" fill="#1F3A5F" stroke="#C9D3DE" stroke-width="1"/><text x="780" y="88" font-family="Segoe UI, Arial, sans-serif" font-size="13.5" font-weight="600" fill="#FFFFFF" text-anchor="middle" dominant-baseline="central"><tspan x="780" dy="0">Admin / Approver</tspan></text><rect x="890" y="62" width="220" height="952" fill="#F6F8FB" stroke="#C9D3DE" stroke-width="1"/><rect x="890" y="62" width="220" height="52" fill="#1F3A5F" stroke="#C9D3DE" stroke-width="1"/><text x="1000" y="88" font-family="Segoe UI, Arial, sans-serif" font-size="13.5" font-weight="600" fill="#FFFFFF" text-anchor="middle" dominant-baseline="central"><tspan x="1000" dy="0">Customer</tspan></text><path d="M120,188 L120,232.5" fill="none" stroke="#34495E" stroke-width="1.5" marker-end="url(#ah)"/><path d="M120,295.5 L120,314 L340,314 L340,332.5" fill="none" stroke="#34495E" stroke-width="1.5" marker-end="url(#ah)"/><path d="M340,395.5 L340,432.5" fill="none" stroke="#34495E" stroke-width="1.5" stroke-dasharray="6 4" marker-end="url(#ah)"/><path d="M340,395.5 L340,414 L560,414 L560,432.5" fill="none" stroke="#34495E" stroke-width="1.5" marker-end="url(#ah)"/><path d="M430,464 L470,464" fill="none" stroke="#34495E" stroke-width="1.5" stroke-dasharray="6 4" marker-end="url(#ah)"/><path d="M560,495.5 L560,523" fill="none" stroke="#34495E" stroke-width="1.5" marker-end="url(#ah)"/><path d="M650,564 L690,564" fill="none" stroke="#34495E" stroke-width="1.5" marker-end="url(#ah)"/><path d="M560,605 L560,732.5" fill="none" stroke="#34495E" stroke-width="1.5" marker-end="url(#ah)"/><path d="M780,595.5 L780,614 L770,614 L770,632.5" fill="none" stroke="#34495E" stroke-width="1.5" marker-end="url(#ah)"/><path d="M870,564 L884,564 L884,764 L650,764" fill="none" stroke="#34495E" stroke-width="1.5" marker-end="url(#ah)"/><path d="M560,795.5 L560,814 L1000,814 L1000,832.5" fill="none" stroke="#34495E" stroke-width="1.5" marker-end="url(#ah)"/><path d="M560,795.5 L560,940" fill="none" stroke="#34495E" stroke-width="1.5" marker-end="url(#ah)"/><rect x="30" y="140" width="180" height="48" rx="24" fill="#1F3A5F" stroke="#1F3A5F" stroke-width="1.6"/><text x="120" y="155.5625" font-family="Segoe UI, Arial, sans-serif" font-size="13.5" font-weight="600" fill="#FFFFFF" text-anchor="middle" dominant-baseline="central"><tspan x="120" dy="0">Finishes the job</tspan><tspan x="120" dy="16.875">on site</tspan></text><rect x="30" y="232.5" width="180" height="63" rx="8" fill="#FFF3E0" stroke="#C77700" stroke-width="1.6"/><text x="120" y="247.125" font-family="Segoe UI, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#4A2C00" text-anchor="middle" dominant-baseline="central"><tspan x="120" dy="0">Sets status = completed;</tspan><tspan x="120" dy="16.875">enters final price</tspan><tspan x="120" dy="16.875">and notes</tspan></text><rect x="250" y="332.5" width="180" height="63" rx="8" fill="#F1ECFA" stroke="#6A4BA3" stroke-width="1.6"/><text x="340" y="347.125" font-family="Segoe UI, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#2E1A55" text-anchor="middle" dominant-baseline="central"><tspan x="340" dy="0">Saves job; sends signed</tspan><tspan x="340" dy="16.875">job.completed webhook</tspan><tspan x="340" dy="16.875">(HMAC, retried)</tspan></text><rect x="250" y="432.5" width="180" height="63" rx="8" fill="#EEF2F5" stroke="#5D6D7E" stroke-width="1.6"/><text x="340" y="447.125" font-family="Segoe UI, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#1C2833" text-anchor="middle" dominant-baseline="central"><tspan x="340" dy="0">Hourly sweep finds</tspan><tspan x="340" dy="16.875">completed jobs with</tspan><tspan x="340" dy="16.875">no event (backup)</tspan></text><rect x="470" y="432.5" width="180" height="63" rx="8" fill="#E7F6EE" stroke="#2E8B57" stroke-width="1.6"/><text x="560" y="447.125" font-family="Segoe UI, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#123D27" text-anchor="middle" dominant-baseline="central"><tspan x="560" dy="0">on_job_completed:</tspan><tspan x="560" dy="16.875">verify, find request;</tspan><tspan x="560" dy="16.875">key = job:{id}</tspan></text><polygon points="560,523 650,564 560,605 470,564" fill="#FFF8D6" stroke="#B08900" stroke-width="1.6"/><text x="560" y="555.5625" font-family="Segoe UI, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#3D3000" text-anchor="middle" dominant-baseline="central"><tspan x="560" dy="0">Price within</tspan><tspan x="560" dy="16.875">published range?</tspan></text><rect x="690" y="532.5" width="180" height="63" rx="8" fill="#FFF3E0" stroke="#C77700" stroke-width="1.6"/><text x="780" y="547.125" font-family="Segoe UI, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#4A2C00" text-anchor="middle" dominant-baseline="central"><tspan x="780" dy="0">Review invoice:</tspan><tspan x="780" dy="16.875">approve, adjust</tspan><tspan x="780" dy="16.875">or decline</tspan></text><rect x="687.5" y="632.5" width="165" height="63" rx="8" fill="#FDECEC" stroke="#C0392B" stroke-width="1.6"/><text x="770" y="647.125" font-family="Segoe UI, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#5C1010" text-anchor="middle" dominant-baseline="central"><tspan x="770" dy="0">Declined: void</tspan><tspan x="770" dy="16.875">invoice; ticket</tspan><tspan x="770" dy="16.875">for a callback</tspan></text><rect x="470" y="732.5" width="180" height="63" rx="8" fill="#E7F6EE" stroke="#2E8B57" stroke-width="1.6"/><text x="560" y="747.125" font-family="Segoe UI, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#123D27" text-anchor="middle" dominant-baseline="central"><tspan x="560" dy="0">Create invoice + Stripe</tspan><tspan x="560" dy="16.875">Checkout link (methods</tspan><tspan x="560" dy="16.875">from tenant profile)</tspan></text><rect x="910" y="832.5" width="180" height="63" rx="8" fill="#FFF3E0" stroke="#C77700" stroke-width="1.6"/><text x="1000" y="847.125" font-family="Segoe UI, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#4A2C00" text-anchor="middle" dominant-baseline="central"><tspan x="1000" dy="0">Receives invoice email</tspan><tspan x="1000" dy="16.875">with secure payment</tspan><tspan x="1000" dy="16.875">link (+ Zelle details)</tspan></text><rect x="470" y="940" width="180" height="48" rx="24" fill="#1F3A5F" stroke="#1F3A5F" stroke-width="1.6"/><text x="560" y="955.5625" font-family="Segoe UI, Arial, sans-serif" font-size="13.5" font-weight="600" fill="#FFFFFF" text-anchor="middle" dominant-baseline="central"><tspan x="560" dy="0">stage = awaiting_payment</tspan><tspan x="560" dy="16.875">→ BP-9</tspan></text><rect x="424.8" y="454" width="50.400000000000006" height="20" rx="3" fill="#FFFFFF" stroke="#D5DBDB" stroke-width="0.8"/><text x="450" y="464" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="400" fill="#34495E" text-anchor="middle" dominant-baseline="central" font-style="italic"><tspan x="450" dy="0">backup</tspan></text><rect x="657.6" y="554" width="24.8" height="20" rx="3" fill="#FFFFFF" stroke="#D5DBDB" stroke-width="0.8"/><text x="670" y="564" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="400" fill="#34495E" text-anchor="middle" dominant-baseline="central" font-style="italic"><tspan x="670" dy="0">No</tspan></text><rect x="544.4" y="658.75" width="31.200000000000003" height="20" rx="3" fill="#FFFFFF" stroke="#D5DBDB" stroke-width="0.8"/><text x="560" y="668.75" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="400" fill="#34495E" text-anchor="middle" dominant-baseline="central" font-style="italic"><tspan x="560" dy="0">Yes</tspan></text><rect x="743.4" y="604" width="63.2" height="20" rx="3" fill="#FFFFFF" stroke="#D5DBDB" stroke-width="0.8"/><text x="775" y="614" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="400" fill="#34495E" text-anchor="middle" dominant-baseline="central" font-style="italic"><tspan x="775" dy="0">Declined</tspan></text><rect x="852.4" y="716" width="63.2" height="20" rx="3" fill="#FFFFFF" stroke="#D5DBDB" stroke-width="0.8"/><text x="884" y="726" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="400" fill="#34495E" text-anchor="middle" dominant-baseline="central" font-style="italic"><tspan x="884" dy="0">Approved</tspan></text><rect x="758" y="804" width="44" height="20" rx="3" fill="#FFFFFF" stroke="#D5DBDB" stroke-width="0.8"/><text x="780" y="814" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="400" fill="#34495E" text-anchor="middle" dominant-baseline="central" font-style="italic"><tspan x="780" dy="0">email</tspan></text><text x="560" y="1036" font-family="Segoe UI, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#34495E" text-anchor="middle" dominant-baseline="central" font-style="italic"><tspan x="560" dy="0">Every step is an audited tool call (ToolCall). A repeated webhook reuses key job:{id} and changes nothing.</tspan></text></svg>