" stroke="#34495E" stroke-width="1.5" marker-end="url(#ah)"/><path d="M585,993 L585,1012.75 L125,1012.75 L125,1032.5" fill="none" stroke="#34495E" stroke-width="1.5" marker-end="url(#ah)"/><path d="M125,1095.5 L125,1115.25 L355,1115.25 L355,1135" fill="none" stroke="#34495E" stroke-width="1.5" marker-end="url(#ah)"/><path d="M355,1193 L355,1216.5 L815,1216.5 L815,1240" fill="none" stroke="#34495E" stroke-width="1.5" marker-end="url(#ah)"/><rect x="260" y="140" width="190" height="48" rx="24" fill="#1F3A5F" stroke="#1F3A5F" stroke-width="1.6"/><text x="355" y="155.5625" font-family="Segoe UI, Arial, sans-serif" font-size="13.5" font-weight="600" fill="#FFFFFF" text-anchor="middle" dominant-baseline="central"><tspan x="355" dy="0">Service request</tspan><tspan x="355" dy="16.875">from BP-6</tspan></text><rect x="490" y="232.5" width="190" height="63" rx="8" fill="#F1ECFA" stroke="#6A4BA3" stroke-width="1.6"/><text x="585" y="247.125" font-family="Segoe UI, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#2E1A55" text-anchor="middle" dominant-baseline="central"><tspan x="585" dy="0">CRM lookup: customer,</tspan><tspan x="585" dy="16.875">equipment history,</tspan><tspan x="585" dy="16.875">warranty, plan</tspan></text><rect x="260" y="332.5" width="190" height="63" rx="8" fill="#E7F6EE" stroke="#2E8B57" stroke-width="1.6"/><text x="355" y="347.125" font-family="Segoe UI, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#123D27" text-anchor="middle" dominant-baseline="central"><tspan x="355" dy="0">Enrich &amp; prioritize:</tspan><tspan x="355" dy="16.875">urgency, SLA, plan,</tspan><tspan x="355" dy="16.875">warranty status</tspan></text><rect x="490" y="435" width="190" height="58" rx="8" fill="#F1ECFA" stroke="#6A4BA3" stroke-width="1.6"/><text x="585" y="455.5625" font-family="Segoe UI, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#2E1A55" text-anchor="middle" dominant-baseline="central"><tspan x="585" dy="0">Technician availability</tspan><tspan x="585" dy="16.875">by skill &amp; territory</tspan></text><rect x="260" y="532.5" width="190" height="63" rx="8" fill="#E7F6EE" stroke="#2E8B57" stroke-width="1.6"/><text x="355" y="547.125" font-family="Segoe UI, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#123D27" text-anchor="middle" dominant-baseline="central"><tspan x="355" dy="0">Propose 2–3 slots; show</tspan><tspan x="355" dy="16.875">price range from approved</tspan><tspan x="355" dy="16.875">price book</tspan></text><polygon points="355,623 450,664 355,705 260,664" fill="#FFF8D6" stroke="#B08900" stroke-width="1.6"/><text x="355" y="655.5625" font-family="Segoe UI, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#3D3000" text-anchor="middle" dominant-baseline="central"><tspan x="355" dy="0">Within auto-</tspan><tspan x="355" dy="16.875">approval policy?</tspan></text><rect x="720" y="635" width="190" height="58" rx="8" fill="#FFF3E0" stroke="#C77700" stroke-width="1.6"/><text x="815" y="655.5625" font-family="Segoe UI, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#4A2C00" text-anchor="middle" dominant-baseline="central"><tspan x="815" dy="0">Approve / adjust</tspan><tspan x="815" dy="16.875">proposal</tspan></text><rect x="30" y="735" width="190" height="58" rx="8" fill="#FFF3E0" stroke="#C77700" stroke-width="1.6"/><text x="125" y="755.5625" font-family="Segoe UI, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#4A2C00" text-anchor="middle" dominant-baseline="central"><tspan x="125" dy="0">Selects slot;</tspan><tspan x="125" dy="16.875">accepts terms</tspan></text><rect x="490" y="832.5" width="190" height="63" rx="8" fill="#F1ECFA" stroke="#6A4BA3" stroke-width="1.6"/><text x="585" y="847.125" font-family="Segoe UI, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#2E1A55" text-anchor="middle" dominant-baseline="central"><tspan x="585" dy="0">Book appointment; create</tspan><tspan x="585" dy="16.875">work order (idempotent</tspan><tspan x="585" dy="16.875">request key)</tspan></text><rect x="720" y="835" width="190" height="58" rx="8" fill="#FFF3E0" stroke="#C77700" stroke-width="1.6"/><text x="815" y="855.5625" font-family="Segoe UI, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#4A2C00" text-anchor="middle" dominant-baseline="central"><tspan x="815" dy="0">Monitor agent actions;</tspan><tspan x="815" dy="16.875">override / reassign</tspan></text><rect x="490" y="935" width="190" height="58" rx="8" fill="#F1ECFA" stroke="#6A4BA3" stroke-width="1.6"/><text x="585" y="955.5625" font-family="Segoe UI, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#2E1A55" text-anchor="middle" dominant-baseline="central"><tspan x="585" dy="0">Send confirmation &amp;</tspan><tspan x="585" dy="16.875">reminders; sync CRM</tspan></text><rect x="30" y="1032.5" width="190" height="63" rx="8" fill="#FFF3E0" stroke="#C77700" stroke-width="1.6"/><text x="125" y="1047.125" font-family="Segoe UI, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#4A2C00" text-anchor="middle" dominant-baseline="central"><tspan x="125" dy="0">Gets updates; can</tspan><tspan x="125" dy="16.875">reschedule / cancel</tspan><tspan x="125" dy="16.875">in chat</tspan></text><rect x="260" y="1135" width="190" height="58" rx="8" fill="#E7F6EE" stroke="#2E8B57" stroke-width="1.6"/><text x="355" y="1155.5625" font-family="Segoe UI, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#123D27" text-anchor="middle" dominant-baseline="central"><tspan x="355" dy="0">Post-visit: survey,</tspan><tspan x="355" dy="16.875">close loop in CRM</tspan></text><rect x="720" y="1240" width="190" height="48" rx="24" fill="#1F3A5F" stroke="#1F3A5F" stroke-width="1.6"/><text x="815" y="1255.5625" font-family="Segoe UI, Arial, sans-serif" font-size="13.5" font-weight="600" fill="#FFFFFF" text-anchor="middle" dominant-baseline="central"><tspan x="815" dy="0">KPIs: conversion,</tspan><tspan x="815" dy="16.875">time-to-book, CSAT</tspan></text><rect x="508.6" y="646.5" width="152.8" height="35" rx="3" fill="#FFFFFF" stroke="#D5DBDB" stroke-width="0.8"/><text x="585" y="656.5" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="400" fill="#34495E" text-anchor="middle" dominant-baseline="central" font-style="italic"><tspan x="585" dy="0">No: binding quote,</tspan><tspan x="585" dy="15">after-hours, exception</tspan></text><rect x="224.4" y="710" width="31.200000000000003" height="20" rx="3" fill="#FFFFFF" stroke="#D5DBDB" stroke-width="0.8"/><text x="240" y="720" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="400" fill="#34495E" text-anchor="middle" dominant-baseline="central" font-style="italic"><tspan x="240" dy="0">Yes</tspan></text><rect x="665.2" y="854" width="69.6" height="20" rx="3" fill="#FFFFFF" stroke="#D5DBDB" stroke-width="0.8"/><text x="700" y="864" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="400" fill="#34495E" text-anchor="middle" dominant-baseline="central" font-style="italic"><tspan x="700" dy="0">audit log</tspan></text></svg>