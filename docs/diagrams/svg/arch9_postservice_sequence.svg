<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="966" viewBox="0 0 1200 966"><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#34495E"/></marker><marker id="ahb" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7F8C8D"/></marker></defs><rect width="100%" height="100%" fill="#FFFFFF"/><text x="600" y="22" font-family="Segoe UI, Arial, sans-serif" font-size="19" font-weight="700" fill="#1F3A5F" text-anchor="middle" dominant-baseline="central"><tspan x="600" dy="0">Post-Service Event Sequence (Phase 4)</tspan></text><text x="600" y="44" font-family="Segoe UI, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#5D6D7E" text-anchor="middle" dominant-baseline="central"><tspan x="600" dy="0">job.completed → invoice → payment → review; every write is idempotent and audited</tspan></text><line x1="92.5" y1="118" x2="92.5" y2="956" stroke="#AEB6BF" stroke-width="1.2" stroke-dasharray="5 4"/><rect x="28" y="62" width="129" height="56" rx="7" fill="#FFF3E0" stroke="#C77700" stroke-width="1.6"/><text x="92.5" y="81.875" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="600" fill="#4A2C00" text-anchor="middle" dominant-baseline="central"><tspan x="92.5" dy="0">Technician /</tspan><tspan x="92.5" dy="16.25">admin app</tspan></text><line x1="237.5" y1="118" x2="237.5" y2="956" stroke="#AEB6BF" stroke-width="1.2" stroke-dasharray="5 4"/><rect x="173" y="62" width="129" height="56" rx="7" fill="#E7F6EE" stroke="#2E8B57" stroke-width="1.6"/><text x="237.5" y="81.875" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="600" fill="#123D27" text-anchor="middle" dominant-baseline="central"><tspan x="237.5" dy="0">Scheduling</tspan><tspan x="237.5" dy="16.25">service</tspan></text><line x1="382.5" y1="118" x2="382.5" y2="956" stroke="#AEB6BF" stroke-width="1.2" stroke-dasharray="5 4"/><rect x="318" y="62" width="129" height="56" rx="7" fill="#E7F6EE" stroke="#2E8B57" stroke-width="1.6"/><text x="382.5" y="90" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="600" fill="#123D27" text-anchor="middle" dominant-baseline="central"><tspan x="382.5" dy="0">ServiceIQ API</tspan></text><line x1="527.5" y1="118" x2="527.5" y2="956" stroke="#AEB6BF" stroke-width="1.2" stroke-dasharray="5 4"/><rect x="463" y="62" width="129" height="56" rx="7" fill="#E7F6EE" stroke="#2E8B57" stroke-width="1.6"/><text x="527.5" y="90" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="600" fill="#123D27" text-anchor="middle" dominant-baseline="central"><tspan x="527.5" dy="0">Agent</tspan></text><line x1="672.5" y1="118" x2="672.5" y2="956" stroke="#AEB6BF" stroke-width="1.2" stroke-dasharray="5 4"/><rect x="608" y="62" width="129" height="56" rx="7" fill="#E8F0FB" stroke="#2F5B9A" stroke-width="1.6"/><text x="672.5" y="81.875" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="600" fill="#14284B" text-anchor="middle" dominant-baseline="central"><tspan x="672.5" dy="0">Policy +</tspan><tspan x="672.5" dy="16.25">audit log</tspan></text><line x1="817.5" y1="118" x2="817.5" y2="956" stroke="#AEB6BF" stroke-width="1.2" stroke-dasharray="5 4"/><rect x="753" y="62" width="129" height="56" rx="7" fill="#F1ECFA" stroke="#6A4BA3" stroke-width="1.6"/><text x="817.5" y="90" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="600" fill="#2E1A55" text-anchor="middle" dominant-baseline="central"><tspan x="817.5" dy="0">Stripe</tspan></text><line x1="962.5" y1="118" x2="962.5" y2="956" stroke="#AEB6BF" stroke-width="1.2" stroke-dasharray="5 4"/><rect x="898" y="62" width="129" height="56" rx="7" fill="#F1ECFA" stroke="#6A4BA3" stroke-width="1.6"/><text x="962.5" y="90" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="600" fill="#2E1A55" text-anchor="middle" dominant-baseline="central"><tspan x="962.5" dy="0">Email (SMTP)</tspan></text><line x1="1107.5" y1="118" x2="1107.5" y2="956" stroke="#AEB6BF" stroke-width="1.2" stroke-dasharray="5 4"/><rect x="1043" y="62" width="129" height="56" rx="7" fill="#FFF3E0" stroke="#C77700" stroke-width="1.6"/><text x="1107.5" y="90" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="600" fill="#4A2C00" text-anchor="middle" dominant-baseline="central"><tspan x="1107.5" dy="0">Customer</tspan></text><path d="M92.5,156 H235.5" fill="none" stroke="#34495E" stroke-width="1.5" marker-end="url(#ah)"/><rect x="4.75" y="132" width="320.5" height="18" fill="#FFFFFF" opacity="0.92"/><text x="165" y="140" font-family="Segoe UI, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#1C2833" text-anchor="middle" dominant-baseline="central"><tspan x="165" dy="0">1. PUT /api/jobs/{id} status=completed, price</tspan></text><path d="M237.5,200 H380.5" fill="none" stroke="#34495E" stroke-width="1.5" marker-end="url(#ah)"/><rect x="149.75" y="176" width="320.5" height="18" fill="#FFFFFF" opacity="0.92"/><text x="310" y="184" font-family="Segoe UI, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#1C2833" text-anchor="middle" dominant-baseline="central"><tspan x="310" dy="0">2. POST /v1/events/fieldservice (HMAC-signed)</tspan></text><path d="M382.5,244 H525.5" fill="none" stroke="#34495E" stroke-width="1.5" marker-end="url(#ah)"/><rect x="329.25" y="220" width="251.5" height="18" fill="#FFFFFF" opacity="0.92"/><text x="455" y="228" font-family="Segoe UI, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#1C2833" text-anchor="middle" dominant-baseline="central"><tspan x="455" dy="0">3. on_job_completed(request, price)</tspan></text><path d="M527.5,288 H670.5" fill="none" stroke="#34495E" stroke-width="1.5" marker-end="url(#ah)"/><rect x="484.6" y="264" width="230.8" height="18" fill="#FFFFFF" opacity="0.92"/><text x="600" y="272" font-family="Segoe UI, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#1C2833" text-anchor="middle" dominant-baseline="central"><tspan x="600" dy="0">4. check_invoice: price vs range</tspan></text><rect x="24" y="310" width="1152" height="28" rx="4" fill="#FFF8D6" stroke="#B08900" stroke-width="0.8"/><text x="40" y="324" font-family="Segoe UI, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#3D3000" text-anchor="start" dominant-baseline="central" font-style="italic"><tspan x="40" dy="0">alt  outside the published range → Approval row + admin email; continues after Agent.decide(approve)</tspan></text><path d="M527.5,378 H815.5" fill="none" stroke="#34495E" stroke-width="1.5" marker-end="url(#ah)"/><rect x="564" y="338" width="217" height="34" fill="#FFFFFF" opacity="0.92"/><text x="672.5" y="346.1875" font-family="Segoe UI, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#1C2833" text-anchor="middle" dominant-baseline="central"><tspan x="672.5" dy="0">5. create Checkout Session</tspan><tspan x="672.5" dy="15.625">(idempotency key = invoice id)</tspan></text><path d="M817.5,428 H529.5" fill="none" stroke="#5D6D7E" stroke-width="1.5" stroke-dasharray="6 4" marker-end="url(#ah)"/><rect x="574.35" y="404" width="196.3" height="18" fill="#FFFFFF" opacity="0.92"/><text x="672.5" y="412" font-family="Segoe UI, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#1C2833" text-anchor="middle" dominant-baseline="central"><tspan x="672.5" dy="0">6. session id + payment URL</tspan></text><path d="M527.5,472 H670.5" fill="none" stroke="#34495E" stroke-width="1.5" marker-end="url(#ah)"/><rect x="446.65" y="448" width="306.7" height="18" fill="#FFFFFF" opacity="0.92"/><text x="600" y="456" font-family="Segoe UI, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#1C2833" text-anchor="middle" dominant-baseline="central"><tspan x="600" dy="0">7. audit: create_invoice, send_payment_link</tspan></text><path d="M527.5,516 H960.5" fill="none" stroke="#34495E" stroke-width="1.5" marker-end="url(#ah)"/><rect x="622.7" y="492" width="244.60000000000002" height="18" fill="#FFFFFF" opacity="0.92"/><text x="745" y="500" font-family="Segoe UI, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#1C2833" text-anchor="middle" dominant-baseline="central"><tspan x="745" dy="0">8. invoice email with payment link</tspan></text><path d="M962.5,560 H1105.5" fill="none" stroke="#5D6D7E" stroke-width="1.5" stroke-dasharray="6 4" marker-end="url(#ah)"/><rect x="971.35" y="536" width="127.30000000000001" height="18" fill="#FFFFFF" opacity="0.92"/><text x="1035" y="544" font-family="Segoe UI, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#1C2833" text-anchor="middle" dominant-baseline="central"><tspan x="1035" dy="0">9. invoice + link</tspan></text><path d="M1107.5,604 H819.5" fill="none" stroke="#34495E" stroke-width="1.5" marker-end="url(#ah)"/><rect x="819.5" y="580" width="286" height="18" fill="#FFFFFF" opacity="0.92"/><text x="962.5" y="588" font-family="Segoe UI, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#1C2833" text-anchor="middle" dominant-baseline="central"><tspan x="962.5" dy="0">10. pays: card / wallet / ACH / Cash App</tspan></text><path d="M817.5,656 H384.5" fill="none" stroke="#34495E" stroke-width="1.5" marker-end="url(#ah)"/><rect x="436.29999999999995" y="616" width="327.40000000000003" height="34" fill="#FFFFFF" opacity="0.92"/><text x="600" y="624.1875" font-family="Segoe UI, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#1C2833" text-anchor="middle" dominant-baseline="central"><tspan x="600" dy="0">11. signed webhook: checkout.session.completed</tspan><tspan x="600" dy="15.625">or async_payment_succeeded</tspan></text><path d="M382.5,706 H525.5" fill="none" stroke="#34495E" stroke-width="1.5" marker-end="url(#ah)"/><rect x="343.05" y="682" width="223.9" height="18" fill="#FFFFFF" opacity="0.92"/><text x="455" y="690" font-family="Segoe UI, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#1C2833" text-anchor="middle" dominant-baseline="central"><tspan x="455" dy="0">12. on_paid(event) — idempotent</tspan></text><path d="M527.5,750 H960.5" fill="none" stroke="#34495E" stroke-width="1.5" marker-end="url(#ah)"/><rect x="626.15" y="726" width="237.70000000000002" height="18" fill="#FFFFFF" opacity="0.92"/><text x="745" y="734" font-family="Segoe UI, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#1C2833" text-anchor="middle" dominant-baseline="central"><tspan x="745" dy="0">13. receipt + review request link</tspan></text><path d="M1107.5,794 H384.5" fill="none" stroke="#34495E" stroke-width="1.5" marker-end="url(#ah)"/><rect x="608.9" y="770" width="272.2" height="18" fill="#FFFFFF" opacity="0.92"/><text x="745" y="778" font-family="Segoe UI, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#1C2833" text-anchor="middle" dominant-baseline="central"><tspan x="745" dy="0">14. POST /v1/reviews (rating, comment)</tspan></text><path d="M382.5,838 H525.5" fill="none" stroke="#34495E" stroke-width="1.5" marker-end="url(#ah)"/><rect x="315.45" y="814" width="279.1" height="18" fill="#FFFFFF" opacity="0.92"/><text x="455" y="822" font-family="Segoe UI, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#1C2833" text-anchor="middle" dominant-baseline="central"><tspan x="455" dy="0">15. record_review: redact; ≤ 3 → ticket</tspan></text><path d="M527.5,882 H1105.5" fill="none" stroke="#5D6D7E" stroke-width="1.5" stroke-dasharray="6 4" marker-end="url(#ah)"/><rect x="643.45" y="858" width="348.1" height="18" fill="#FFFFFF" opacity="0.92"/><text x="817.5" y="866" font-family="Segoe UI, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#1C2833" text-anchor="middle" dominant-baseline="central"><tspan x="817.5" dy="0">16. thank-you + public review link (every rating)</tspan></text><rect x="24" y="904" width="1152" height="28" rx="4" fill="#FFF8D6" stroke="#B08900" stroke-width="0.8"/><text x="40" y="918" font-family="Segoe UI, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#3D3000" text-anchor="start" dominant-baseline="central" font-style="italic"><tspan x="40" dy="0">alt  off-line payment: admin “Mark paid (Zelle / check / cash)” → record_manual_payment → same on_paid path</tspan></text></svg>