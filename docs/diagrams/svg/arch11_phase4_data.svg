="400" fill="#34495E" text-anchor="start" dominant-baseline="central"><tspan x="770" dy="0">zelle_handle</tspan></text><text x="770" y="551" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="400" fill="#34495E" text-anchor="start" dominant-baseline="central"><tspan x="770" dy="0">review_url (public review page)</tspan></text><text x="770" y="568" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="400" fill="#34495E" text-anchor="start" dominant-baseline="central"><tspan x="770" dy="0">payment_reminder_days</tspan></text><rect x="343" y="122.25" width="44" height="20" rx="3" fill="#FFFFFF" stroke="#D5DBDB" stroke-width="0.8"/><text x="365" y="132.25" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="400" fill="#34495E" text-anchor="middle" dominant-baseline="central" font-style="italic"><tspan x="365" dy="0">1 : N</tspan></text><rect x="158" y="254.5" width="44" height="20" rx="3" fill="#FFFFFF" stroke="#D5DBDB" stroke-width="0.8"/><text x="180" y="264.5" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="400" fill="#34495E" text-anchor="middle" dominant-baseline="central" font-style="italic"><tspan x="180" dy="0">1 : N</tspan></text><rect x="333.4" y="314.5" width="63.2" height="20" rx="3" fill="#FFFFFF" stroke="#D5DBDB" stroke-width="0.8"/><text x="365" y="324.5" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="400" fill="#34495E" text-anchor="middle" dominant-baseline="central" font-style="italic"><tspan x="365" dy="0">1 : 0..1</tspan></text><rect x="711.6" y="108" width="56.800000000000004" height="20" rx="3" fill="#FFFFFF" stroke="#D5DBDB" stroke-width="0.8"/><text x="740" y="118" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="400" fill="#34495E" text-anchor="middle" dominant-baseline="central" font-style="italic"><tspan x="740" dy="0">audited</tspan></text><rect x="689.2" y="396.75" width="101.60000000000001" height="20" rx="3" fill="#FFFFFF" stroke="#D5DBDB" stroke-width="0.8"/><text x="740" y="406.75" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="400" fill="#34495E" text-anchor="middle" dominant-baseline="central" font-style="italic"><tspan x="740" dy="0">≤ 3 → recovery</tspan></text></svg>