<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="640" viewBox="0 0 1100 640"><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#34495E"/></marker><marker id="ahb" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7F8C8D"/></marker></defs><rect width="100%" height="100%" fill="#FFFFFF"/><text x="550" y="22" font-family="Segoe UI, Arial, sans-serif" font-size="19" font-weight="700" fill="#1F3A5F" text-anchor="middle" dominant-baseline="central"><tspan x="550" dy="0">Phase 4 Data Model Additions</tspan></text><text x="550" y="44" font-family="Segoe UI, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#5D6D7E" text-anchor="middle" dominant-baseline="central"><tspan x="550" dy="0">New tables in green; existing tables (grey) gain new values. New columns on existing tables go in NEW_COLUMNS (db.py)</tspan></text><path d="M340,129.5 L365,129.5 L365,135 L390,135" fill="none" stroke="#34495E" stroke-width="1.5" marker-end="url(#ah)"/><path d="M180,229 L180,300" fill="none" stroke="#34495E" stroke-width="1.5" marker-end="url(#ah)"/><path d="M340,189.5 L365,189.5 L365,459.5 L390,459.5" fill="none" stroke="#34495E" stroke-width="1.5" marker-end="url(#ah)"/><path d="M720,115 L740,115 L740,121 L760,121" fill="none" stroke="#34495E" stroke-width="1.5" stroke-dasharray="6 4" marker-end="url(#ah)"/><path d="M720,459.5 L740,459.5 L740,354 L760,354" fill="none" stroke="#34495E" stroke-width="1.5" stroke-dasharray="6 4" marker-end="url(#ah)"/><rect x="20" y="70" width="320" height="159" rx="6" fill="#FFFFFF" stroke="#5D6D7E" stroke-width="1.5"/><path d="M20,76 a6,6 0 0 1 6,-6 h308 a6,6 0 0 1 6,6 v24 h-320 z" fill="#EEF2F5" stroke="#5D6D7E" stroke-width="1.5"/><text x="180" y="85" font-family="Segoe UI, Arial, sans-serif" font-size="13.5" font-weight="700" fill="#1C2833" text-anchor="middle" dominant-baseline="central"><tspan x="180" dy="0">ServiceRequest (existing)</tspan></text><text x="30" y="110" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="600" fill="#14284B" text-anchor="start" dominant-baseline="central"><tspan x="30" dy="0">request_id PK</tspan></text><text x="30" y="127" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="400" fill="#34495E" text-anchor="start" dominant-baseline="central"><tspan x="30" dy="0">tenant_id FK, conversation_id</tspan></text><text x="30" y="144" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="400" fill="#34495E" text-anchor="start" dominant-baseline="central"><tspan x="30" dy="0">payload (ServiceRequestV1)</tspan></text><text x="30" y="161" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="400" fill="#34495E" text-anchor="start" dominant-baseline="central"><tspan x="30" dy="0">job_ref (scheduling job id)</tspan></text><text x="30" y="178" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="400" fill="#34495E" text-anchor="start" dominant-baseline="central"><tspan x="30" dy="0">status: … scheduled → completed |</tspan></text><text x="30" y="195" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="400" fill="#34495E" text-anchor="start" dominant-baseline="central"><tspan x="30" dy="0">  invoiced | paid | reviewed</tspan></text><text x="30" y="212" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="400" fill="#34495E" text-anchor="start" dominant-baseline="central"><tspan x="30" dy="0">String(16): every value fits</tspan></text><rect x="20" y="300" width="320" height="125" rx="6" fill="#FFFFFF" stroke="#5D6D7E" stroke-width="1.5"/><path d="M20,306 a6,6 0 0 1 6,-6 h308 a6,6 0 0 1 6,6 v24 h-320 z" fill="#EEF2F5" stroke="#5D6D7E" stroke-width="1.5"/><text x="180" y="315" font-family="Segoe UI, Arial, sans-serif" font-size="13.5" font-weight="700" fill="#1C2833" text-anchor="middle" dominant-baseline="central"><tspan x="180" dy="0">Approval (existing)</tspan></text><text x="30" y="340" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="600" fill="#14284B" text-anchor="start" dominant-baseline="central"><tspan x="30" dy="0">approval_id PK</tspan></text><text x="30" y="357" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="400" fill="#34495E" text-anchor="start" dominant-baseline="central"><tspan x="30" dy="0">request_id FK, condition</tspan></text><text x="30" y="374" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="400" fill="#34495E" text-anchor="start" dominant-baseline="central"><tspan x="30" dy="0">+ invoice_out_of_range</tspan></text><text x="30" y="391" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="400" fill="#34495E" text-anchor="start" dominant-baseline="central"><tspan x="30" dy="0">proposal JSON (+ kind: invoice)</tspan></text><text x="30" y="408" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="400" fill="#34495E" text-anchor="start" dominant-baseline="central"><tspan x="30" dy="0">status, decided_by, escalated_at</tspan></text><rect x="390" y="70" width="330" height="210" rx="6" fill="#FFFFFF" stroke="#2E8B57" stroke-width="1.5"/><path d="M390,76 a6,6 0 0 1 6,-6 h318 a6,6 0 0 1 6,6 v24 h-330 z" fill="#E7F6EE" stroke="#2E8B57" stroke-width="1.5"/><text x="555" y="85" font-family="Segoe UI, Arial, sans-serif" font-size="13.5" font-weight="700" fill="#123D27" text-anchor="middle" dominant-baseline="central"><tspan x="555" dy="0">Invoice (new)</tspan></text><text x="400" y="110" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="600" fill="#14284B" text-anchor="start" dominant-baseline="central"><tspan x="400" dy="0">invoice_id PK</tspan></text><text x="400" y="127" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="400" fill="#34495E" text-anchor="start" dominant-baseline="central"><tspan x="400" dy="0">tenant_id FK, request_id FK, job_ref</tspan></text><text x="400" y="144" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="400" fill="#34495E" text-anchor="start" dominant-baseline="central"><tspan x="400" dy="0">amount_cents, currency</tspan></text><text x="400" y="161" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="400" fill="#34495E" text-anchor="start" dominant-baseline="central"><tspan x="400" dy="0">status: pending_approval | sent |</tspan></text><text x="400" y="178" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="400" fill="#34495E" text-anchor="start" dominant-baseline="central"><tspan x="400" dy="0">  processing | paid | failed | void</tspan></text><text x="400" y="195" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="400" fill="#34495E" text-anchor="start" dominant-baseline="central"><tspan x="400" dy="0">method: card | ach | cashapp |</tspan></text><text x="400" y="212" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="400" fill="#34495E" text-anchor="start" dominant-baseline="central"><tspan x="400" dy="0">  zelle | check | cash</tspan></text><text x="400" y="229" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="400" fill="#34495E" text-anchor="start" dominant-baseline="central"><tspan x="400" dy="0">provider_session_id, payment_url</tspan></text><text x="400" y="246" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="400" fill="#34495E" text-anchor="start" dominant-baseline="central"><tspan x="400" dy="0">sent_at, paid_at, reminded_at</tspan></text><text x="400" y="263" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="400" fill="#34495E" text-anchor="start" dominant-baseline="central"><tspan x="400" dy="0">recorded_by (manual payments)</tspan></text><rect x="390" y="380" width="330" height="159" rx="6" fill="#FFFFFF" stroke="#2E8B57" stroke-width="1.5"/><path d="M390,386 a6,6 0 0 1 6,-6 h318 a6,6 0 0 1 6,6 v24 h-330 z" fill="#E7F6EE" stroke="#2E8B57" stroke-width="1.5"/><text x="555" y="395" font-family="Segoe UI, Arial, sans-serif" font-size="13.5" font-weight="700" fill="#123D27" text-anchor="middle" dominant-baseline="central"><tspan x="555" dy="0">Review (new)</tspan></text><text x="400" y="420" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="600" fill="#14284B" text-anchor="start" dominant-baseline="central"><tspan x="400" dy="0">review_id PK</tspan></text><text x="400" y="437" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="400" fill="#34495E" text-anchor="start" dominant-baseline="central"><tspan x="400" dy="0">tenant_id FK, request_id FK</tspan></text><text x="400" y="454" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="400" fill="#34495E" text-anchor="start" dominant-baseline="central"><tspan x="400" dy="0">rating (1–5)</tspan></text><text x="400" y="471" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="400" fill="#34495E" text-anchor="start" dominant-baseline="central"><tspan x="400" dy="0">comment (PII-redacted)</tspan></text><text x="400" y="488" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="400" fill="#34495E" text-anchor="start" dominant-baseline="central"><tspan x="400" dy="0">public_link_shown (always true)</tspan></text><text x="400" y="505" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="400" fill="#34495E" text-anchor="start" dominant-baseline="central"><tspan x="400" dy="0">recovery_escalation_id FK</tspan></text><text x="400" y="522" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="400" fill="#34495E" text-anchor="start" dominant-baseline="central"><tspan x="400" dy="0">created_at</tspan></text><rect x="760" y="70" width="320" height="142" rx="6" fill="#FFFFFF" stroke="#5D6D7E" stroke-width="1.5"/><path d="M760,76 a6,6 0 0 1 6,-6 h308 a6,6 0 0 1 6,6 v24 h-3