<svg xmlns="http://www.w3.org/2000/svg" width="940" height="1328" viewBox="0 0 940 1328"><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#34495E"/></marker><marker id="ahb" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7F8C8D"/></marker></defs><rect width="100%" height="100%" fill="#FFFFFF"/><text x="470" y="22" font-family="Segoe UI, Arial, sans-serif" font-size="19" font-weight="700" fill="#1F3A5F" text-anchor="middle" dominant-baseline="central"><tspan x="470" dy="0">BP-3  Customer Question Answering (MVP)</tspan></text><text x="470" y="44" font-family="Segoe UI, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#5D6D7E" text-anchor="middle" dominant-baseline="central"><tspan x="470" dy="0">Every answer is grounded and cited, or the system abstains / escalates</tspan></text><rect x="10" y="62" width="230" height="1252" fill="#F6F8FB" stroke="#C9D3DE" stroke-width="1"/><rect x="10" y="62" width="230" height="52" fill="#1F3A5F" stroke="#C9D3DE" stroke-width="1"/><text x="125" y="88" font-family="Segoe UI, Arial, sans-serif" font-size="13.5" font-weight="600" fill="#FFFFFF" text-anchor="middle" dominant-baseline="central"><tspan x="125" dy="0">Customer</tspan></text><rect x="240" y="62" width="230" height="1252" fill="#FFFFFF" stroke="#C9D3DE" stroke-width="1"/><rect x="240" y="62" width="230" height="52" fill="#1F3A5F" stroke="#C9D3DE" stroke-width="1"/><text x="355" y="88" font-family="Segoe UI, Arial, sans-serif" font-size="13.5" font-weight="600" fill="#FFFFFF" text-anchor="middle" dominant-baseline="central"><tspan x="355" dy="0">Chat Widget</tspan></text><rect x="470" y="62" width="230" height="1252" fill="#F6F8FB" stroke="#C9D3DE" stroke-width="1"/><rect x="470" y="62" width="230" height="52" fill="#1F3A5F" stroke="#C9D3DE" stroke-width="1"/><text x="585" y="88" font-family="Segoe UI, Arial, sans-serif" font-size="13.5" font-weight="600" fill="#FFFFFF" text-anchor="middle" dominant-baseline="central"><tspan x="585" dy="0">ServiceIQ RAG Service</tspan></text><rect x="700" y="62" width="230" height="1252" fill="#FFFFFF" stroke="#C9D3DE" stroke-width="1"/><rect x="700" y="62" width="230" height="52" fill="#1F3A5F" stroke="#C9D3DE" stroke-width="1"/><text x="815" y="88" font-family="Segoe UI, Arial, sans-serif" font-size="13.5" font-weight="600" fill="#FFFFFF" text-anchor="middle" dominant-baseline="central"><tspan x="815" dy="0">Human Team (CSR)</tspan></text><path d="M125,188 L125,211.5 L355,211.5 L355,235" fill="none" stroke="#34495E" stroke-width="1.5" marker-end="url(#ah)"/><path d="M355,293 L355,312.75 L585,312.75 L585,332.5" fill="none" stroke="#34495E" stroke-width="1.5" marker-end="url(#ah)"/><path d="M585,395.5 L585,423" fill="none" stroke="#34495E" stroke-width="1.5" marker-end="url(#ah)"/><path d="M490,464 L450,464" fill="none" stroke="#34495E" stroke-width="1.5" marker-end="url(#ah)"/><path d="M585,505 L585,532.5" fill="none" stroke="#34495E" stroke-width="1.5" marker-end="url(#ah)"/><path d="M585,595.5 L585,632.5" fill="none" stroke="#34495E" stroke-width="1.5" marker-end="url(#ah)"/><path d="M585,695.5 L585,723" fill="none" stroke="#34495E" stroke-width="1.5" marker-end="url(#ah)"/><path d="M680,764 L720,764" fill="none" stroke="#34495E" stroke-width="1.5" marker-end="url(#ah)"/><path d="M585,805 L585,835" fill="none" stroke="#34495E" stroke-width="1.5" marker-end="url(#ah)"/><path d="M585,893 L585,923" fill="none" stroke="#34495E" stroke-width="1.5" marker-end="url(#ah)"/><path d="M490,964 L450,964" fill="none" stroke="#34495E" stroke-width="1.5" marker-end="url(#ah)"/><path d="M585,1005 L585,1020 L355,1020 L355,1035" fill="none" stroke="#34495E" stroke-width="1.5" marker-end="url(#ah)"/><path d="M355,995.5 L355,1035" fill="none" stroke="#34495E" stroke-width="1.5" marker-end="url(#ah)"/><path d="M355,1093 L355,1114 L125,1114 L125,1135" fill="none" stroke="#34495E" stroke-width="1.5" marker-end="url(#ah)"/><path d="M125,1193 L125,1240" fill="none" stroke="#34495E" stroke-width="1.5" marker-end="url(#ah)"/><rect x="30" y="140" width="190" height="48" rx="24" fill="#1F3A5F" stroke="#1F3A5F" stroke-width="1.6"/><text x="125" y="155.5625" font-family="Segoe UI, Arial, sans-serif" font-size="13.5" font-weight="600" fill="#FFFFFF" text-anchor="middle" dominant-baseline="central"><tspan x="125" dy="0">Asks a question in</tspan><tspan x="125" dy="16.875">natural language</tspan></text><rect x="260" y="235" width="190" height="58" rx="8" fill="#E8F0FB" stroke="#2F5B9A" stroke-width="1.6"/><text x="355" y="255.5625" font-family="Segoe UI, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#14284B" text-anchor="middle" dominant-baseline="central"><tspan x="355" dy="0">Send message with</tspan><tspan x="355" dy="16.875">session &amp; widget key</tspan></text><rect x="490" y="332.5" width="190" height="63" rx="8" fill="#E7F6EE" stroke="#2E8B57" stroke-width="1.6"/><text x="585" y="347.125" font-family="Segoe UI, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#123D27" text-anchor="middle" dominant-baseline="central"><tspan x="585" dy="0">Resolve tenant; input</tspan><tspan x="585" dy="16.875">guardrails (PII, abuse,</tspan><tspan x="585" dy="16.875">prompt injection)</tspan></text><polygon points="585,423 680,464 585,505 490,464" fill="#FFF8D6" stroke="#B08900" stroke-width="1.6"/><text x="585" y="455.5625" font-family="Segoe UI, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#3D3000" text-anchor="middle" dominant-baseline="central"><tspan x="585" dy="0">Emergency?</tspan><tspan x="585" dy="16.875">(gas, CO, fire)</tspan></text><rect x="260" y="435" width="190" height="58" rx="8" fill="#FDECEC" stroke="#C0392B" stroke-width="1.6"/><text x="355" y="455.5625" font-family="Segoe UI, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#5C1010" text-anchor="middle" dominant-baseline="central"><tspan x="355" dy="0">Safety guidance first;</tspan><tspan x="355" dy="16.875">notify on-call (BP-4)</tspan></text><rect x="490" y="532.5" width="190" height="63" rx="8" fill="#E7F6EE" stroke="#2E8B57" stroke-width="1.6"/><text x="585" y="547.125" font-family="Segoe UI, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#123D27" text-anchor="middle" dominant-baseline="central"><tspan x="585" dy="0">Retrieve top_k = 10 with</tspan><tspan x="585" dy="16.875">tenant, approval &amp; date</tspan><tspan x="585" dy="16.875">filters</tspan></text><rect x="490" y="632.5" width="190" height="63" rx="8" fill="#E7F6EE" stroke="#2E8B57" stroke-width="1.6"/><text x="585" y="647.125" font-family="Segoe UI, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#123D27" text-anchor="middle" dominant-baseline="central"><tspan x="585" dy="0">Rerank → top 5; resolve</tspan><tspan x="585" dy="16.875">conflicts by authority &amp;</tspan><tspan x="585" dy="16.875">effective date</tspan></text><polygon points="585,723 680,764 585,805 490,764" fill="#FFF8D6" stroke="#B08900" stroke-width="1.6"/><text x="585" y="755.5625" font-family="Segoe UI, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#3D3000" text-anchor="middle" dominant-baseline="central"><tspan x="585" dy="0">Sufficient &amp;</tspan><tspan x="585" dy="16.875">consistent evidence?</tspan></text><rect x="720" y="732.5" width="190" height="63" rx="8" fill="#FFF3E0" stroke="#C77700" stroke-width="1.6"/><text x="815" y="747.125" font-family="Segoe UI, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#4A2C00" text-anchor="middle" dominant-baseline="central"><tspan x="815" dy="0">Escalate with context</tspan><tspan x="815" dy="16.875">(BP-4); customer told</tspan><tspan x="815" dy="16.875">how &amp; when</tspan></text><rect x="490" y="835" width="190" height="58" rx="8" fill="#E7F6EE" stroke="#2E8B57" stroke-width="1.6"/><text x="585" y="855.5625" font-family="Segoe UI, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#123D27" text-anchor="middle" dominant-baseline="central"><tspan x="585" dy="0">Generate concise answer</tspan><tspan x="585" dy="16.875">with citations</tspan></text><polygon points="585,923 680,964 585,1005 490,964" fill="#FFF8D6" stroke="#B08900" stroke-width="1.6"/><text x="585" y="955.5625" font-family="Segoe UI, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#3D3000" text-anchor="middle" dominant-baseline="central"><tspan x="585" dy="0">Grounding &amp;</tspan><tspan x="585" dy="16.875">citation check pass?</tspan></text><rect x="260" y="932.5" width="190" height="63" rx="8" fill="#FDECEC" stroke="#C0392B" stroke-width="1.6"/><text x="355" y="947.125" font-family="Segoe UI, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#5C1010" text-anchor="middle" dominant-baseline="central"><tspan x="355" dy="0">Safe fallback: cannot</tspan><tspan x="355" dy="16.875">confirm + offer human</tspan><tspan x="355" dy="16.875">contact</tspan></text><rect x="260" y="1035" width="190" height="58" rx="8" fill="#E8F0FB" stroke="#2F5B9A" stroke-width="1.6"/><text x="355" y="1055.5625" font-family="Segoe UI, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#14284B" text-anchor="middle" dominant-baseline="central"><tspan x="355" dy="0">Display answer / message</tspan><tspan x="355" dy="16.875">with source citations</tspan></text><rect x="30" y="1135" width="190" height="58" rx="8" fill="#FFF3E0" stroke="#C77700" stroke-width="1.6"/><text x="125" y="1155.5625" font-family="Segoe UI, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#4A2C00" text-anchor="middle" dominant-baseline="central"><tspan x="125" dy="0">Reads answer, opens</tspan><tspan x="125" dy="16.875">citations, rates it</tspan></text><rect x="30" y="1240" width="190" height="48" rx="24" fill="#1F3A5F" stroke="#1F3A5F" stroke-width="1.6"/><text x="125" y="1255.5625" font-family="Segoe UI, Arial, sans-serif" font-size="13.5" font-weight="600" fill="#FFFFFF" text-anchor="middle" dominant-baseline="central"><tspan x="125" dy="0">Resolved or</tspan><tspan x="125" dy="16.875">next question</tspan></text><rect x="454.4" y="454" width="31.200000000000003" height="20" rx="3" fill="#FFFFFF" stroke="#D5DBDB" stroke-width="0.8"/><text x="470" y="464" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="400" fill="#34495E" text-anchor="middle" dominant-baseline="central" font-style="italic"><tspan x="470" dy="0">Yes</tspan></text><rect x="572.6" y="508.75" width="24.8" height="20" rx="3" fill="#FFFFFF" stroke="#D5DBDB" stroke-width="0.8"/><text x="585" y="518.75" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="400" fill="#34495E" text-anchor="middle" dominant-baseline="central" font-style="italic"><tspan x="585" dy="0">No</tspan></text><rect x="687.6" y="754" width="24.8" height="20" rx="3" fill="#FFFFFF" stroke="#D5DBDB" stroke-width="0.8"/><text x="700" y="764" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="400" fill="#34495E" text-anchor="middle" dominant-baseline="central" font-style="italic"><tspan x="700" dy="0">No</tspan></text><rect x="569.4" y="810" width="31.200000000000003" height="20" rx="3" fill="#FFFFFF" stroke="#D5DBDB" stroke-width="0.8"/><text x="585" y="820" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="400" fill="#34495E" text-anchor="middle" dominant-baseline="central" font-style="italic"><tspan x="585" dy="0">Yes</tspan></text><rect x="457.6" y="954" width="24.8" height="20" rx="3" fill="#FFFFFF" stroke="#D5DBDB" stroke-width="0.8"/><text x="470" y="964" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="400" fill="#34495E" text-anchor="middle" dominant-baseline="central" font-style="italic"><tspan x="470" dy="0">No</tspan></text><rect x="454.4" y="1010" width="31.200000000000003" height="20" rx="3" fill="#FFFFFF" stroke="#D5DBDB" stroke-width="0.8"/><text x="470" y="1020" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="400" fill="#34495E" text-anchor="middle" dominant-baseline="central" font-style="italic"><tspan x="470" dy="0">Yes</tspan></text></svg>