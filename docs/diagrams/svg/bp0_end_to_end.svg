<svg xmlns="http://www.w3.org/2000/svg" width="1190" height="470" viewBox="0 0 1190 470"><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#34495E"/></marker><marker id="ahb" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7F8C8D"/></marker></defs><rect width="100%" height="100%" fill="#FFFFFF"/><text x="595" y="22" font-family="Segoe UI, Arial, sans-serif" font-size="19" font-weight="700" fill="#1F3A5F" text-anchor="middle" dominant-baseline="central"><tspan x="595" dy="0">End-to-End Service Flow: Appointment → Field Service → Payment → Review</tspan></text><text x="595" y="44" font-family="Segoe UI, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#5D6D7E" text-anchor="middle" dominant-baseline="central"><tspan x="595" dy="0">One agent owns the job across its whole life; events wake it up when the customer is not chatting</tspan></text><rect x="600" y="62" width="575" height="225" rx="10" fill="#F3FAF6" stroke="#2E8B57" stroke-width="1.3"/><text x="614" y="79" font-family="Segoe UI, Arial, sans-serif" font-size="13.5" font-weight="700" fill="#123D27" text-anchor="start" dominant-baseline="central"><tspan x="614" dy="0">Phase 4 (this document)</tspan></text><path d="M190,134 L215,134" fill="none" stroke="#34495E" stroke-width="1.5" marker-end="url(#ah)"/><path d="M385,134 L410,134" fill="none" stroke="#34495E" stroke-width="1.5" marker-end="url(#ah)"/><path d="M580,134 L615,134" fill="none" stroke="#34495E" stroke-width="1.5" marker-end="url(#ah)"/><path d="M785,134 L805,134" fill="none" stroke="#34495E" stroke-width="1.5" marker-end="url(#ah)"/><path d="M975,134 L995,134" fill="none" stroke="#34495E" stroke-width="1.5" marker-end="url(#ah)"/><path d="M105,176 L105,200" fill="none" stroke="#34495E" stroke-width="1.5" stroke-dasharray="6 4" marker-end="url(#ah)"/><path d="M300,176 L300,200" fill="none" stroke="#34495E" stroke-width="1.5" stroke-dasharray="6 4" marker-end="url(#ah)"/><path d="M495,176 L495,200" fill="none" stroke="#34495E" stroke-width="1.5" stroke-dasharray="6 4" marker-end="url(#ah)"/><path d="M700,176 L700,200" fill="none" stroke="#34495E" stroke-width="1.5" stroke-dasharray="6 4" marker-end="url(#ah)"/><path d="M890,176 L890,200" fill="none" stroke="#34495E" stroke-width="1.5" stroke-dasharray="6 4" marker-end="url(#ah)"/><path d="M1080,176 L1080,200" fill="none" stroke="#34495E" stroke-width="1.5" stroke-dasharray="6 4" marker-end="url(#ah)"/><rect x="20" y="92" width="170" height="84" rx="8" fill="#E7F6EE" stroke="#2E8B57" stroke-width="1.6"/><text x="105" y="117.125" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700" fill="#123D27" text-anchor="middle" dominant-baseline="central"><tspan x="105" dy="0">BP-6</tspan></text><text x="105" y="134.3125" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="400" fill="#123D27" text-anchor="middle" dominant-baseline="central"><tspan x="105" dy="0">AI service intake</tspan><tspan x="105" dy="16.25">(Phase 2, live)</tspan></text><rect x="215" y="92" width="170" height="84" rx="8" fill="#E7F6EE" stroke="#2E8B57" stroke-width="1.6"/><text x="300" y="117.125" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700" fill="#123D27" text-anchor="middle" dominant-baseline="central"><tspan x="300" dy="0">BP-7</tspan></text><text x="300" y="134.3125" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="400" fill="#123D27" text-anchor="middle" dominant-baseline="central"><tspan x="300" dy="0">Booking under policy</tspan><tspan x="300" dy="16.25">(Phase 3, live)</tspan></text><rect x="410" y="92" width="170" height="84" rx="8" fill="#FFF3E0" stroke="#C77700" stroke-width="1.6"/><text x="495" y="117.125" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700" fill="#4A2C00" text-anchor="middle" dominant-baseline="central"><tspan x="495" dy="0">Field service</tspan></text><text x="495" y="134.3125" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="400" fill="#4A2C00" text-anchor="middle" dominant-baseline="central"><tspan x="495" dy="0">Technician does the job</tspan><tspan x="495" dy="16.25">(scheduling service)</tspan></text><rect x="615" y="92" width="170" height="84" rx="8" fill="#E7F6EE" stroke="#2E8B57" stroke-width="1.6"/><text x="700" y="125.5625" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700" fill="#123D27" text-anchor="middle" dominant-baseline="central"><tspan x="700" dy="0">BP-8</tspan></text><text x="700" y="142.4375" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="400" fill="#123D27" text-anchor="middle" dominant-baseline="central"><tspan x="700" dy="0">Completion &amp; invoicing</tspan></text><rect x="805" y="92" width="170" height="84" rx="8" fill="#E7F6EE" stroke="#2E8B57" stroke-width="1.6"/><text x="890" y="125.5625" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700" fill="#123D27" text-anchor="middle" dominant-baseline="central"><tspan x="890" dy="0">BP-9</tspan></text><text x="890" y="142.4375" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="400" fill="#123D27" text-anchor="middle" dominant-baseline="central"><tspan x="890" dy="0">Payment collection</tspan></text><rect x="995" y="92" width="170" height="84" rx="8" fill="#E7F6EE" stroke="#2E8B57" stroke-width="1.6"/><text x="1080" y="125.5625" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700" fill="#123D27" text-anchor="middle" dominant-baseline="central"><tspan x="1080" dy="0">BP-10</tspan></text><text x="1080" y="142.4375" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="400" fill="#123D27" text-anchor="middle" dominant-baseline="central"><tspan x="1080" dy="0">Review &amp; recovery</tspan></text><rect x="20" y="200" width="170" height="72" rx="8" fill="#EEF2F5" stroke="#5D6D7E" stroke-width="1.6"/><text x="105" y="221" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="400" fill="#1C2833" text-anchor="middle" dominant-baseline="central"><tspan x="105" dy="0">Trigger: chat message</tspan><tspan x="105" dy="15">stage: collecting →</tspan><tspan x="105" dy="15">confirming</tspan></text><rect x="215" y="200" width="170" height="72" rx="8" fill="#EEF2F5" stroke="#5D6D7E" stroke-width="1.6"/><text x="300" y="221" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="400" fill="#1C2833" text-anchor="middle" dominant-baseline="central"><tspan x="300" dy="0">Trigger: customer confirms</tspan><tspan x="300" dy="15">stage: choosing_slot →</tspan><tspan x="300" dy="15">booked | awaiting_approval</tspan></text><rect x="410" y="200" width="170" height="72" rx="8" fill="#EEF2F5" stroke="#5D6D7E" stroke-width="1.6"/><text x="495" y="221" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="400" fill="#1C2833" text-anchor="middle" dominant-baseline="central"><tspan x="495" dy="0">Trigger: technician sets</tspan><tspan x="495" dy="15">status = completed</tspan><tspan x="495" dy="15">+ final price</tspan></text><rect x="615" y="200" width="170" height="72" rx="8" fill="#EEF2F5" stroke="#5D6D7E" stroke-width="1.6"/><text x="700" y="221" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="400" fill="#1C2833" text-anchor="middle" dominant-baseline="central"><tspan x="700" dy="0">Trigger: job.completed</tspan><tspan x="700" dy="15">webhook (sweep backup)</tspan><tspan x="700" dy="15">stage: awaiting_payment</tspan></text><rect x="805" y="200" width="170" height="72" rx="8" fill="#EEF2F5" stroke="#5D6D7E" stroke-width="1.6"/><text x="890" y="221" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="400" fill="#1C2833" text-anchor="middle" dominant-baseline="central"><tspan x="890" dy="0">Trigger: Stripe webhook</tspan><tspan x="890" dy="15">or admin “mark paid”</tspan><tspan x="890" dy="15">stage: paid</tspan></text><rect x="995" y="200" width="170" height="72" rx="8" fill="#EEF2F5" stroke="#5D6D7E" stroke-width="1.6"/><text x="1080" y="221" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="400" fill="#1C2833" text-anchor="middle" dominant-baseline="central"><tspan x="1080" dy="0">Trigger: rating submitted</tspan><tspan x="1080" dy="15">stage: reviewed |</tspan><tspan x="1080" dy="15">recovery</tspan></text><rect x="20" y="310" width="1145" height="56" rx="8" fill="#E8F0FB" stroke="#2F5B9A" stroke-width="1.6"/><text x="592.5" y="338" font-family="Segoe UI, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#14284B" text-anchor="middle" dominant-baseline="central"><tspan x="592.5" dy="0">One ServiceIQ agent (LangGraph): same conversation thread · one policy layer (policy.py) · one audit log (ToolCall) · Postgres checkpointer</tspan></text><rect x="20" y="384" width="1145" height="62" rx="8" fill="#FFF3E0" stroke="#C77700" stroke-width="1.6"/><text x="592.5" y="406.875" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="400" fill="#4A2C00" text-anchor="middle" dominant-baseline="central"><tspan x="592.5" dy="0">Humans in the loop: admin approves quotes, warranty, after-hours visits and out-of-range invoices · technician enters the final price</tspan><tspan x="592.5" dy="16.25">admin records Zelle / check / cash payments · service manager follows up on low ratings</tspan></text></svg>