fill="none" stroke="#34495E" stroke-width="1.5" marker-end="url(#ah)"/><path d="M815,895.5 L815,915.25 L585,915.25 L585,935" fill="none" stroke="#34495E" stroke-width="1.5" marker-end="url(#ah)"/><path d="M585,993 L585,1014 L355,1014 L355,1035" fill="none" stroke="#34495E" stroke-width="1.5" marker-end="url(#ah)"/><path d="M355,1093 L355,1116.5 L125,1116.5 L125,1140" fill="none" stroke="#34495E" stroke-width="1.5" marker-end="url(#ah)"/><rect x="260" y="140" width="190" height="48" rx="24" fill="#1F3A5F" stroke="#1F3A5F" stroke-width="1.6"/><text x="355" y="155.5625" font-family="Segoe UI, Arial, sans-serif" font-size="13.5" font-weight="600" fill="#FFFFFF" text-anchor="middle" dominant-baseline="central"><tspan x="355" dy="0">Escalation trigger</tspan><tspan x="355" dy="16.875">detected</tspan></text><rect x="260" y="235" width="190" height="58" rx="8" fill="#E7F6EE" stroke="#2E8B57" stroke-width="1.6"/><text x="355" y="255.5625" font-family="Segoe UI, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#123D27" text-anchor="middle" dominant-baseline="central"><tspan x="355" dy="0">Classify trigger &amp;</tspan><tspan x="355" dy="16.875">assign priority (P1–P3)</tspan></text><polygon points="355,323 450,364 355,405 260,364" fill="#FFF8D6" stroke="#B08900" stroke-width="1.6"/><text x="355" y="364" font-family="Segoe UI, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#3D3000" text-anchor="middle" dominant-baseline="central"><tspan x="355" dy="0">Emergency (P1)?</tspan></text><rect x="30" y="335" width="190" height="58" rx="8" fill="#FDECEC" stroke="#C0392B" stroke-width="1.6"/><text x="125" y="355.5625" font-family="Segoe UI, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#5C1010" text-anchor="middle" dominant-baseline="central"><tspan x="125" dy="0">Sees safety steps &amp;</tspan><tspan x="125" dy="16.875">emergency numbers</tspan></text><rect x="490" y="335" width="190" height="58" rx="8" fill="#FDECEC" stroke="#C0392B" stroke-width="1.6"/><text x="585" y="355.5625" font-family="Segoe UI, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#5C1010" text-anchor="middle" dominant-baseline="central"><tspan x="585" dy="0">On-call paged</tspan><tspan x="585" dy="16.875">(SMS / phone)</tspan></text><rect x="260" y="432.5" width="190" height="63" rx="8" fill="#E7F6EE" stroke="#2E8B57" stroke-width="1.6"/><text x="355" y="447.125" font-family="Segoe UI, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#123D27" text-anchor="middle" dominant-baseline="central"><tspan x="355" dy="0">Build handoff packet:</tspan><tspan x="355" dy="16.875">transcript, intent,</tspan><tspan x="355" dy="16.875">citations, gaps</tspan></text><rect x="30" y="535" width="190" height="58" rx="8" fill="#FFF3E0" stroke="#C77700" stroke-width="1.6"/><text x="125" y="555.5625" font-family="Segoe UI, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#4A2C00" text-anchor="middle" dominant-baseline="central"><tspan x="125" dy="0">Consents; gives name,</tspan><tspan x="125" dy="16.875">phone, email, address</tspan></text><rect x="260" y="632.5" width="190" height="63" rx="8" fill="#E7F6EE" stroke="#2E8B57" stroke-width="1.6"/><text x="355" y="647.125" font-family="Segoe UI, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#123D27" text-anchor="middle" dominant-baseline="central"><tspan x="355" dy="0">Create handoff ticket;</tspan><tspan x="355" dy="16.875">notify CSR queue;</tspan><tspan x="355" dy="16.875">give customer reference</tspan></text><rect x="490" y="732.5" width="190" height="63" rx="8" fill="#FFF3E0" stroke="#C77700" stroke-width="1.6"/><text x="585" y="747.125" font-family="Segoe UI, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#4A2C00" text-anchor="middle" dominant-baseline="central"><tspan x="585" dy="0">Review packet; contact</tspan><tspan x="585" dy="16.875">customer within</tspan><tspan x="585" dy="16.875">response SLA</tspan></text><polygon points="585,823 680,864 585,905 490,864" fill="#FFF8D6" stroke="#B08900" stroke-width="1.6"/><text x="585" y="855.5625" font-family="Segoe UI, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#3D3000" text-anchor="middle" dominant-baseline="central"><tspan x="585" dy="0">Needs technician</tspan><tspan x="585" dy="16.875">or manager?</tspan></text><rect x="720" y="832.5" width="190" height="63" rx="8" fill="#FFF3E0" stroke="#C77700" stroke-width="1.6"/><text x="815" y="847.125" font-family="Segoe UI, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#4A2C00" text-anchor="middle" dominant-baseline="central"><tspan x="815" dy="0">Diagnose; issue binding</tspan><tspan x="815" dy="16.875">quote or warranty</tspan><tspan x="815" dy="16.875">decision</tspan></text><rect x="490" y="935" width="190" height="58" rx="8" fill="#FFF3E0" stroke="#C77700" stroke-width="1.6"/><text x="585" y="955.5625" font-family="Segoe UI, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#4A2C00" text-anchor="middle" dominant-baseline="central"><tspan x="585" dy="0">Resolve: answer,</tspan><tspan x="585" dy="16.875">book visit manually</tspan></text><rect x="260" y="1035" width="190" height="58" rx="8" fill="#E7F6EE" stroke="#2E8B57" stroke-width="1.6"/><text x="355" y="1055.5625" font-family="Segoe UI, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#123D27" text-anchor="middle" dominant-baseline="central"><tspan x="355" dy="0">Record outcome; flag</tspan><tspan x="355" dy="16.875">knowledge gap (BP-5)</tspan></text><rect x="30" y="1140" width="190" height="48" rx="24" fill="#1F3A5F" stroke="#1F3A5F" stroke-width="1.6"/><text x="125" y="1155.5625" font-family="Segoe UI, Arial, sans-serif" font-size="13.5" font-weight="600" fill="#FFFFFF" text-anchor="middle" dominant-baseline="central"><tspan x="125" dy="0">Customer issue</tspan><tspan x="125" dy="16.875">resolved</tspan></text><rect x="224.4" y="354" width="31.200000000000003" height="20" rx="3" fill="#FFFFFF" stroke="#D5DBDB" stroke-width="0.8"/><text x="240" y="364" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="400" fill="#34495E" text-anchor="middle" dominant-baseline="central" font-style="italic"><tspan x="240" dy="0">Yes</tspan></text><rect x="454.4" y="354" width="31.200000000000003" height="20" rx="3" fill="#FFFFFF" stroke="#D5DBDB" stroke-width="0.8"/><text x="470" y="364" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="400" fill="#34495E" text-anchor="middle" dominant-baseline="central" font-style="italic"><tspan x="470" dy="0">Yes</tspan></text><rect x="342.6" y="408.75" width="24.8" height="20" rx="3" fill="#FFFFFF" stroke="#D5DBDB" stroke-width="0.8"/><text x="355" y="418.75" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="400" fill="#34495E" text-anchor="middle" dominant-baseline="central" font-style="italic"><tspan x="355" dy="0">No</tspan></text><rect x="684.4" y="854" width="31.200000000000003" height="20" rx="3" fill="#FFFFFF" stroke="#D5DBDB" stroke-width="0.8"/><text x="700" y="864" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="400" fill="#34495E" text-anchor="middle" dominant-baseline="central" font-style="italic"><tspan x="700" dy="0">Yes</tspan></text><rect x="572.6" y="910" width="24.8" height="20" rx="3" fill="#FFFFFF" stroke="#D5DBDB" stroke-width="0.8"/><text x="585" y="920" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="400" fill="#34495E" text-anchor="middle" dominant-baseline="central" font-style="italic"><tspan x="585" dy="0">No</tspan></text></svg>