<svg xmlns="http://www.w3.org/2000/svg" width="940" height="1228" viewBox="0 0 940 1228"><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#34495E"/></marker><marker id="ahb" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7F8C8D"/></marker></defs><rect width="100%" height="100%" fill="#FFFFFF"/><text x="470" y="22" font-family="Segoe UI, Arial, sans-serif" font-size="19" font-weight="700" fill="#1F3A5F" text-anchor="middle" dominant-baseline="central"><tspan x="470" dy="0">BP-4  Human Escalation &amp; Handoff</tspan></text><text x="470" y="44" font-family="Segoe UI, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#5D6D7E" text-anchor="middle" dominant-baseline="central"><tspan x="470" dy="0">Triggers: emergency · insufficient or conflicting evidence · binding quote · licensed-technician need · customer request</tspan></text><rect x="10" y="62" width="230" height="1152" fill="#F6F8FB" stroke="#C9D3DE" stroke-width="1"/><rect x="10" y="62" width="230" height="52" fill="#1F3A5F" stroke="#C9D3DE" stroke-width="1"/><text x="125" y="88" font-family="Segoe UI, Arial, sans-serif" font-size="13.5" font-weight="600" fill="#FFFFFF" text-anchor="middle" dominant-baseline="central"><tspan x="125" dy="0">Customer</tspan></text><rect x="240" y="62" width="230" height="1152" fill="#FFFFFF" stroke="#C9D3DE" stroke-width="1"/><rect x="240" y="62" width="230" height="52" fill="#1F3A5F" stroke="#C9D3DE" stroke-width="1"/><text x="355" y="88" font-family="Segoe UI, Arial, sans-serif" font-size="13.5" font-weight="600" fill="#FFFFFF" text-anchor="middle" dominant-baseline="central"><tspan x="355" dy="0">ServiceIQ</tspan></text><rect x="470" y="62" width="230" height="1152" fill="#F6F8FB" stroke="#C9D3DE" stroke-width="1"/><rect x="470" y="62" width="230" height="52" fill="#1F3A5F" stro