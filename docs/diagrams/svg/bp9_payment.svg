<svg xmlns="http://www.w3.org/2000/svg" width="980" height="1060" viewBox="0 0 980 1060"><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#34495E"/></marker><marker id="ahb" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7F8C8D"/></marker></defs><rect width="100%" height="100%" fill="#FFFFFF"/><text x="490" y="22" font-family="Segoe UI, Arial, sans-serif" font-size="19" font-weight="700" fill="#1F3A5F" text-anchor="middle" dominant-baseline="central"><tspan x="490" dy="0">BP-9  Payment Collection (Phase 4)</tspan></text><text x="490" y="44" font-family="Segoe UI, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#5D6D7E" text-anchor="middle" dominant-baseline="central"><tspan x="490" dy="0">Hosted Stripe Checkout for online methods; admin records off-line payments; one shared “paid” path</tspan></text><rect x="10" y="62" width="240" height="952" fill="#F6F8FB" stroke="#C9D3DE" stroke-width="1"/><rect x="10" y="62" width="240" height="52" fill="#1F3A5F" stroke="#C9D3DE" stroke-width="1"/><text x="130" y="88" font-family="Segoe UI, Arial, sans-serif" font-size="13.5" font-weight="600" fill="#FFFFFF" text-anchor="middle" dominant-baseline="central"><tspan x="130" dy="0">Customer</tspan></text><rect x="250" y="62" width="240" height="952" fill="#FFFFFF" stroke="#C9D3DE" stroke-width="1"/><rect x="250" y="62" width="240" height="52" fill="#1F3A5F" stroke="#C9D3DE" stroke-width="1"/><text x="370" y="79.5625" font-family="Segoe UI, Arial, sans-serif" font-size="13.5" font-weight="600" fill="#FFFFFF" text-anchor="middle" dominant-baseline="central"><tspan x="370" dy="0">Stripe Checkout</tspan><tspan x="370" dy="16.875">(hosted)</tspan></text><rect x="490" y="62" width="240" height="952" fill="#F6F8FB" stroke="#C9D3DE" stroke-width="1"/><rect x="490" y="62" width="240" height="52" fill="#1F3A5F" stroke="#C9D3DE" stroke-width="1"/><text x="610" y="88" font-family="Segoe UI, Arial, sans-serif" font-size="13.5" font-weight="600" fill="#FFFFFF" text-anchor="middle" dominant-baseline="central"><tspan x="610" dy="0">ServiceIQ Agent</tspan></text><rect x="730" y="62" width="240" height="952" fill="#FFFFFF" stroke="#C9D3DE" stroke-width="1"/><rect x="730" y="62" width="240" height="52" fill="#1F3A5F" stroke="#C9D3DE" stroke-width="1"/><text x="850" y="88" font-family="Segoe UI, Arial, sans-serif" font-size="13.5" font-weight="600" fill="#FFFFFF" text-anchor="middle" dominant-baseline="central"><tspan x="850" dy="0">Admin</tspan></text><path d="M130,186 L130,223" fill="none" stroke="#34495E" stroke-width="1.5" marker-end="url(#ah)"/><path d="M130,305 L130,318.75 L370,318.75 L370,332.5" fill="none" stroke="#34495E" stroke-width="1.5" marker-end="url(#ah)"/><path d="M230,264 L850,264 L850,332.5" fill="none" stroke="#34495E" stroke-width="1.5" marker-end="url(#ah)"/><path d="M370,395.5 L370,432.5" fill="none" stroke="#34495E" stroke-width="1.5" marker-end="url(#ah)"/><path d="M370,495.5 L370,514 L610,514 L610,532.5" fill="none" stroke="#34495E" stroke-width="1.5" marker-end="url(#ah)"/><path d="M610,595.5 L610,623" fill="none" stroke="#34495E" stroke-width="1.5" marker-end="url(#ah)"/><path d="M710,664 L750,664" fill="none" stroke="#34495E" stroke-width="1.5" marker-end="url(#ah)"/><path d="M610,705 L610,732.5" fill="none" stroke="#34495E" stroke-width="1.5" marker-end="url(#ah)"/><path d="M950,364 L966,364 L966,764 L710,764" fill="none" stroke="#34495E" stroke-width="1.5" marker-end="url(#ah)"/><path d="M610,795.5 L610,815.25 L130,815.25 L130,835" fill="none" stroke="#34495E" stroke-width="1.5" marker-end="url(#ah)"/><path d="M610,795.5 L610,940" fill="none" stroke="#34495E" stroke-width="1.5" marker-end="url(#ah)"/><rect x="30" y="142" width="200" height="44" rx="22" fill="#1F3A5F" stroke="#1F3A5F" stroke-width="1.6"/><text x="130" y="164" font-family="Segoe UI, Arial, sans-serif" font-size="13.5" font-weight="600" fill="#FFFFFF" text-anchor="middle" dominant-baseline="central"><tspan x="130" dy="0">Opens invoice email</tspan></text><polygon points="130,223 230,264 130,305 30,264" fill="#FFF8D6" stroke="#B08900" stroke-width="1.6"/><text x="130" y="255.5625" font-family="Segoe UI, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#3D3000" text-anchor="middle" dominant-baseline="central"><tspan x="130" dy="0">Pay online</tspan><tspan x="130" dy="16.875">or off-line?</tspan></text><rect x="270" y="332.5" width="200" height="63" rx="8" fill="#F1ECFA" stroke="#6A4BA3" stroke-width="1.6"/><text x="370" y="347.125" font-family="Segoe UI, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#2E1A55" text-anchor="middle" dominant-baseline="central"><tspan x="370" dy="0">Pays: card, Apple /</tspan><tspan x="370" dy="16.875">Google Pay, ACH bank,</tspan><tspan x="370" dy="16.875">Cash App Pay</tspan></text><rect x="750" y="332.5" width="200" height="63" rx="8" fill="#FFF3E0" stroke="#C77700" stroke-width="1.6"/><text x="850" y="347.125" font-family="Segoe UI, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#4A2C00" text-anchor="middle" dominant-baseline="central"><tspan x="850" dy="0">Records Zelle / check /</tspan><tspan x="850" dy="16.875">cash: “Mark paid”</tspan><tspan x="850" dy="16.875">(audited, recorded_by)</tspan></text><rect x="270" y="432.5" width="200" height="63" rx="8" fill="#F1ECFA" stroke="#6A4BA3" stroke-width="1.6"/><text x="370" y="447.125" font-family="Segoe UI, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#2E1A55" text-anchor="middle" dominant-baseline="central"><tspan x="370" dy="0">Signed webhook: session</tspan><tspan x="370" dy="16.875">completed / async</tspan><tspan x="370" dy="16.875">succeeded / failed</tspan></text><rect x="510" y="532.5" width="200" height="63" rx="8" fill="#E7F6EE" stroke="#2E8B57" stroke-width="1.6"/><text x="610" y="547.125" font-family="Segoe UI, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#123D27" text-anchor="middle" dominant-baseline="central"><tspan x="610" dy="0">Verify signature; set</tspan><tspan x="610" dy="16.875">invoice processing |</tspan><tspan x="610" dy="16.875">paid | failed (idempotent)</tspan></text><polygon points="610,623 710,664 610,705 510,664" fill="#FFF8D6" stroke="#B08900" stroke-width="1.6"/><text x="610" y="664" font-family="Segoe UI, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#3D3000" text-anchor="middle" dominant-baseline="central"><tspan x="610" dy="0">Paid?</tspan></text><rect x="750" y="632.5" width="200" height="63" rx="8" fill="#FDECEC" stroke="#C0392B" stroke-width="1.6"/><text x="850" y="647.125" font-family="Segoe UI, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#5C1010" text-anchor="middle" dominant-baseline="central"><tspan x="850" dy="0">Failed or unpaid N days:</tspan><tspan x="850" dy="16.875">one reminder + new link,</tspan><tspan x="850" dy="16.875">then ticket</tspan></text><rect x="510" y="732.5" width="200" height="63" rx="8" fill="#E7F6EE" stroke="#2E8B57" stroke-width="1.6"/><text x="610" y="747.125" font-family="Segoe UI, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#123D27" text-anchor="middle" dominant-baseline="central"><tspan x="610" dy="0">on_paid: invoice and</tspan><tspan x="610" dy="16.875">request = paid;</tspan><tspan x="610" dy="16.875">send receipt</tspan></text><rect x="30" y="835" width="200" height="58" rx="8" fill="#FFF3E0" stroke="#C77700" stroke-width="1.6"/><text x="130" y="864" font-family="Segoe UI, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#4A2C00" text-anchor="middle" dominant-baseline="central"><tspan x="130" dy="0">Receives receipt</tspan></text><rect x="510" y="940" width="200" height="48" rx="24" fill="#1F3A5F" stroke="#1F3A5F" stroke-width="1.6"/><text x="610" y="955.5625" font-family="Segoe UI, Arial, sans-serif" font-size="13.5" font-weight="600" fill="#FFFFFF" text-anchor="middle" dominant-baseline="central"><tspan x="610" dy="0">stage = paid</tspan><tspan x="610" dy="16.875">→ BP-10</tspan></text><rect x="224.8" y="308.75" width="50.400000000000006" height="20" rx="3" fill="#FFFFFF" stroke="#D5DBDB" stroke-width="0.8"/><text x="250" y="318.75" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="400" fill="#34495E" text-anchor="middle" dominant-baseline="central" font-style="italic"><tspan x="250" dy="0">Online</tspan></text><rect x="476.4" y="254" width="127.2" height="20" rx="3" fill="#FFFFFF" stroke="#D5DBDB" stroke-width="0.8"/><text x="540" y="264" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="400" fill="#34495E" text-anchor="middle" dominant-baseline="central" font-style="italic"><tspan x="540" dy="0">Zelle, check, cash</tspan></text><rect x="717.6" y="654" width="24.8" height="20" rx="3" fill="#FFFFFF" stroke="#D5DBDB" stroke-width="0.8"/><text x="730" y="664" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="400" fill="#34495E" text-anchor="middle" dominant-baseline="central" font-style="italic"><tspan x="730" dy="0">No</tspan></text><rect x="594.4" y="708.75" width="31.200000000000003" height="20" rx="3" fill="#FFFFFF" stroke="#D5DBDB" stroke-width="0.8"/><text x="610" y="718.75" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="400" fill="#34495E" text-anchor="middle" dominant-baseline="central" font-style="italic"><tspan x="610" dy="0">Yes</tspan></text><rect x="901.2" y="554" width="69.6" height="20" rx="3" fill="#FFFFFF" stroke="#D5DBDB" stroke-width="0.8"/><text x="936" y="564" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="400" fill="#34495E" text-anchor="middle" dominant-baseline="central" font-style="italic"><tspan x="936" dy="0">same path</tspan></text><rect x="341.6" y="805.25" width="56.800000000000004" height="20" rx="3" fill="#FFFFFF" stroke="#D5DBDB" stroke-width="0.8"/><text x="370" y="815.25" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="400" fill="#34495E" text-anchor="middle" dominant-baseline="central" font-style="italic"><tspan x="370" dy="0">receipt</tspan></text><text x="490" y="1036" font-family="Segoe UI, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#34495E" text-anchor="middle" dominant-baseline="central" font-style="italic"><tspan x="490" dy="0">Card data never reaches ServiceIQ (hosted Checkout). ACH settles in days, so the review request waits for “paid”.</tspan></text></svg>