e="13.5" font-weight="400" fill="#14284B" text-anchor="middle" dominant-baseline="central"><tspan x="415" dy="0">Verify business; sign</tspan><tspan x="415" dy="16.875">agreement &amp; data-processing terms</tspan></text><rect x="570" y="332.5" width="230" height="63" rx="8" fill="#E7F6EE" stroke="#2E8B57" stroke-width="1.6"/><text x="685" y="347.125" font-family="Segoe UI, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#123D27" text-anchor="middle" dominant-baseline="central"><tspan x="685" dy="0">Provision tenant: tenant_id,</tspan><tspan x="685" dy="16.875">Pinecone namespace, widget key,</tspan><tspan x="685" dy="16.875">admin account</tspan></text><rect x="30" y="432.5" width="230" height="63" rx="8" fill="#FFF3E0" stroke="#C77700" stroke-width="1.6"/><text x="145" y="447.125" font-family="Segoe UI, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#4A2C00" text-anchor="middle" dominant-baseline="central"><tspan x="145" dy="0">Configure profile: service area,</tspan><tspan x="145" dy="16.875">hours, brand, emergency &amp;</tspan><tspan x="145" dy="16.875">escalation contacts</tspan></text><rect x="30" y="535" width="230" height="58" rx="8" fill="#FFF3E0" stroke="#C77700" stroke-width="1.6"/><text x="145" y="555.5625" font-family="Segoe UI, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#4A2C00" text-anchor="middle" dominant-baseline="central"><tspan x="145" dy="0">Invite users &amp; assign roles</tspan><tspan x="145" dy="16.875">(Knowledge Admin, CSR, Viewer)</tspan></text><rect x="30" y="635" width="230" height="58" rx="8" fill="#FFF3E0" stroke="#C77700" stroke-width="1.6"/><text x="145" y="655.5625" font-family="Segoe UI, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#4A2C00" text-anchor="middle" dominant-baseline="central"><tspan x="145" dy="0">Upload &amp; approve initial</tspan><tspan x="145" dy="16.875">knowledge corpus (BP-2)</tspan></text><rect x="570" y="735" width="230" height="58" rx="8" fill="#E7F6EE" stroke="#2E8B57" stroke-width="1.6"/><text x="685" y="755.5625" font-family="Segoe UI, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#123D27" text-anchor="middle" dominant-baseline="central"><tspan x="685" dy="0">Bulk ingest; run baseline</tspan><tspan x="685" dy="16.875">evaluation suite for tenant</tspan></text><polygon points="415,823 530,864 415,905 300,864" fill="#FFF8D6" stroke="#B08900" stroke-width="1.6"/><text x="415" y="855.5625" font-family="Segoe UI, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#3D3000" text-anchor="middle" dominant-baseline="central"><tspan x="415" dy="0">Meets acceptance</tspan><tspan x="415" dy="16.875">thresholds?</tspan></text><rect x="30" y="935" width="230" height="58" rx="8" fill="#FFF3E0" stroke="#C77700" stroke-width="1.6"/><text x="145" y="955.5625" font-family="Segoe UI, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#4A2C00" text-anchor="middle" dominant-baseline="central"><tspan x="145" dy="0">Embed chat-widget script on</tspan><tspan x="145" dy="16.875">website (allow-listed domain)</tspan></text><rect x="570" y="1040" width="230" height="48" rx="24" fill="#1F3A5F" stroke="#1F3A5F" stroke-width="1.6"/><text x="685" y="1055.5625" font-family="Segoe UI, Arial, sans-serif" font-size="13.5" font-weight="600" fill="#FFFFFF" text-anchor="middle" dominant-baseline="central"><tspan x="685" dy="0">Tenant live;</tspan><tspan x="685" dy="16.875">monitoring active</tspan></text><rect x="264.4" y="910" width="31.200000000000003" height="20" rx="3" fill="#FFFFFF" stroke="#D5DBDB" stroke-width="0.8"/><text x="280" y="920" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="400" fill="#34495E" text-anchor="middle" dominant-baseline="central" font-style="italic"><tspan x="280" dy="0">Yes</tspan></text><rect x="-3.6000000000000014" y="746.5" width="127.2" height="35" rx="3" fill="#FFFFFF" stroke="#D5DBDB" stroke-width="0.8"/><text x="60" y="756.5" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="400" fill="#34495E" text-anchor="middle" dominant-baseline="central" font-style="italic"><tspan x="60" dy="0">No: close content</tspan><tspan x="60" dy="15">gaps / tune config</tspan></text></svg>