goe UI, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#4A2C00" text-anchor="middle" dominant-baseline="central"><tspan x="480" dy="0">awaiting_approval</tspan></text><rect x="590" y="95" width="170" height="50" rx="25" fill="#1F3A5F" stroke="#1F3A5F" stroke-width="1.6"/><text x="675" y="120" font-family="Segoe UI, Arial, sans-serif" font-size="13.5" font-weight="600" fill="#FFFFFF" text-anchor="middle" dominant-baseline="central"><tspan x="675" dy="0">booked</tspan></text><rect x="790" y="95" width="370" height="60" rx="8" fill="#EEF2F5" stroke="#5D6D7E" stroke-width="1.6"/><text x="975" y="117.1875" font-family="Segoe UI, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#1C2833" text-anchor="middle" dominant-baseline="central"><tspan x="975" dy="0">Other exits: emergency · not_eligible · escalated ·</tspan><tspan x="975" dy="15.625">intake_cancelled · answered (Q&amp;A only)</tspan></text><rect x="590" y="300" width="170" height="60" rx="8" fill="#E7F6EE" stroke="#2E8B57" stroke-width="1.6"/><text x="675" y="314.375" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700" fill="#123D27" text-anchor="middle" dominant-baseline="central"><tspan x="675" dy="0">awaiting_payment</tspan></text><text x="675" y="330.3125" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="400" fill="#123D27" text-anchor="middle" dominant-baseline="central"><tspan x="675" dy="0">invoice sent or pending</tspan><tspan x="675" dy="15">approval</tspan></text><rect x="800" y="300" width="160" height="60" rx="8" fill="#E7F6EE" stroke="#2E8B57" stroke-width="1.6"/><text x="880" y="322.1875" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700" fill="#123D27" text-anchor="middle" dominant-baseline="central"><tspan x="880" dy="0">paid</tspan></text><text x="880" y="337.8125" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="400" fill="#123D27" text-anchor="middle" dominant-baseline="central"><tspan x="880" dy="0">receipt sent</tspan></text><rect x="1000" y="300" width="160" height="60" rx="8" fill="#E7F6EE" stroke="#2E8B57" stroke-width="1.6"/><text x="1080" y="322.1875" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700" fill="#123D27" text-anchor="middle" dominant-baseline="central"><tspan x="1080" dy="0">review_requested</tspan></text><text x="1080" y="337.8125" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="400" fill="#123D27" text-anchor="middle" dominant-baseline="central"><tspan x="1080" dy="0">link emailed</tspan></text><rect x="1000" y="450" width="160" height="50" rx="25" fill="#1F3A5F" stroke="#1F3A5F" stroke-width="1.6"/><text x="1080" y="475" font-family="Segoe UI, Arial, sans-serif" font-size="13.5" font-weight="600" fill="#FFFFFF" text-anchor="middle" dominant-baseline="central"><tspan x="1080" dy="0">reviewed</tspan></text><rect x="800" y="440" width="160" height="70" rx="8" fill="#FDECEC" stroke="#C0392B" stroke-width="1.6"/><text x="880" y="459.375" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700" fill="#5C1010" text-anchor="middle" dominant-baseline="central"><tspan x="880" dy="0">recovery</tspan></text><text x="880" y="475.3125" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="400" fill="#5C1010" text-anchor="middle" dominant-baseline="central"><tspan x="880" dy="0">ticket open</tspan><tspan x="880" dy="15">(rating ≤ 3)</tspan></text><rect x="590" y="440" width="170" height="70" rx="8" fill="#FDECEC" stroke="#C0392B" stroke-width="1.6"/><text x="675" y="459.375" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700" fill="#5C1010" text-anchor="middle" dominant-baseline="central"><tspan x="675" dy="0">invoice void</tspan></text><text x="675" y="475.3125" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="400" fill="#5C1010" text-anchor="middle" dominant-baseline="central"><tspan x="675" dy="0">declined by approver</tspan><tspan x="675" dy="15">→ callback ticket</tspan></text><rect x="20" y="290" width="520" height="225" rx="8" fill="#EEF2F5" stroke="#5D6D7E" stroke-width="1.6"/><text x="280" y="340" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700" fill="#1C2833" text-anchor="middle" dominant-baseline="central"><tspan x="280" dy="0">Status fields that move with the stages</tspan></text><text x="280" y="357.8125" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="400" fill="#1C2833" text-anchor="middle" dominant-baseline="central"><tspan x="280" dy="0"></tspan><tspan x="280" dy="15">ServiceRequest.status</tspan><tspan x="280" dy="15">scheduled → completed → invoiced → paid → reviewed</tspan><tspan x="280" dy="15"></tspan><tspan x="280" dy="15">Invoice.status</tspan><tspan x="280" dy="15">pending_approval → sent → processing → paid | failed | void</tspan><tspan x="280" dy="15"></tspan><tspan x="280" dy="15">failed: a new link is sent once; after that a ticket is opened</tspan></text><rect x="191.2" y="161" width="101.60000000000001" height="20" rx="3" fill="#FFFFFF" stroke="#D5DBDB" stroke-width="0.8"/><text x="242" y="171" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="400" fill="#34495E" text-anchor="middle" dominant-baseline="central" font-style="italic"><tspan x="242" dy="0">needs approval</tspan></text><rect x="643.4" y="161" width="63.2" height="20" rx="3" fill="#FFFFFF" stroke="#D5DBDB" stroke-width="0.8"/><text x="675" y="171" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="400" fill="#34495E" text-anchor="middle" dominant-baseline="central" font-style="italic"><tspan x="675" dy="0">approved</tspan></text><rect x="627.4" y="251.5" width="95.2" height="20" rx="3" fill="#FFFFFF" stroke="#D5DBDB" stroke-width="0.8"/><text x="675" y="261.5" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="400" fill="#34495E" text-anchor="middle" dominant-baseline="central" font-