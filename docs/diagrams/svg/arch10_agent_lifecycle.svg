<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="560" viewBox="0 0 1180 560"><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#34495E"/></marker><marker id="ahb" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7F8C8D"/></marker></defs><rect width="100%" height="100%" fill="#FFFFFF"/><text x="590" y="22" font-family="Segoe UI, Arial, sans-serif" font-size="19" font-weight="700" fill="#1F3A5F" text-anchor="middle" dominant-baseline="central"><tspan x="590" dy="0">Agent Conversation Lifecycle (stages)</tspan></text><text x="590" y="44" font-family="Segoe UI, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#5D6D7E" text-anchor="middle" dominant-baseline="central"><tspan x="590" dy="0">Phase 4 adds post-service stages to the same checkpointed thread (thread_id = conversation_id)</tspan></text><rect x="10" y="60" width="1160" height="180" rx="10" fill="#F6F8FB" stroke="#AEB6BF" stroke-width="1.3"/><text x="24" y="77" font-family="Segoe UI, Arial, sans-serif" font-size="13.5" font-weight="700" fill="#1F3A5F" text-anchor="start" dominant-baseline="central"><tspan x="24" dy="0">Phase 2–3 (live)</tspan></text><rect x="10" y="255" width="1160" height="290" rx="10" fill="#F3FAF6" stroke="#2E8B57" stroke-width="1.3"/><text x="24" y="272" font-family="Segoe UI, Arial, sans-serif" font-size="13.5" font-weight="700" fill="#123D27" text-anchor="start" dominant-baseline="central"><tspan x="24" dy="0">Phase 4 (this document)</tspan></text><path d="M180,120 L210,120" fill="none" stroke="#34495E" stroke-width="1.5" marker-end="url(#ah)"/><path d="M370,120 L400,120" fill="none" stroke="#34495E" stroke-width="1.5" marker-end="url(#ah)"/><path d="M560,120 L590,120" fill="none" stroke="#34495E" stroke-width="1.5" marker-end="url(#ah)"/><path d="M290,145 L290,197 L400,197" fill